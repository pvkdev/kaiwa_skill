<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8f5">
<title>Harumii · Lộ trình Kaiwa</title>
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem("kaiwa-review:theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
} catch {
  document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f8f5;
  --surface: #fff;
  --soft: #f0f3ef;
  --text: #20352f;
  --muted: #6f7d76;
  --line: #e1e8e1;
  --accent: #2e7057;
  --accent-soft: #e8f2eb;
  --shadow: 0 16px 50px #1c392618;
  --sidebar: 332px;
  --header: 78px;
  font-family: Inter, "Noto Sans JP", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101b18;
  --surface: #16241f;
  --soft: #1d2e27;
  --text: #e6eee8;
  --muted: #a1b3a8;
  --line: #2a3d32;
  --accent: #9ed8b6;
  --accent-soft: #223d2e;
  --shadow: 0 16px 50px #0005;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; }
button, input { font: inherit; }
button, a, summary { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: default; opacity: .35; }
a { color: var(--accent); text-underline-offset: 4px; }
button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 4px;
}
button { border: 0; }
[hidden] { display: none !important; }
.skip { position: fixed; top: -100px; left: 16px; z-index: 100; padding: 12px; background: var(--surface); }
.skip:focus { top: 12px; }
.topbar {
  position: fixed; inset: 0 0 auto; height: var(--header); z-index: 30;
  display: flex; align-items: center; gap: 24px; padding: 0 28px 0 22px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; width: calc(var(--sidebar) - 22px); flex-shrink: 0; }
.brand-mark {
  width: 39px; height: 39px; border-radius: 13px; display: grid; place-items: center;
  background: var(--accent); color: var(--surface); font: 700 22px serif;
}
.brand strong { font-size: 20px; letter-spacing: -.6px; }
.brand small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 1.4px; margin-top: 3px; }
.level-tabs { display: flex; padding: 5px; background: var(--soft); border-radius: 13px; gap: 3px; }
.level-tab { min-width: 100px; padding: 10px 18px; background: transparent; color: var(--muted); border-radius: 9px; font-weight: 650; }
.level-tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 2px 5px #0000000c; }
.level-tab span { margin-left: 7px; font-size: 11px; opacity: .65; }
.header-tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.version { color: var(--muted); font-size: 12px; white-space: nowrap; }
.theme-button, .nav-trigger, .drawer-close {
  background: transparent; display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; min-height: 44px; padding: 9px 12px; border-radius: 10px;
}
.theme-button:hover, .nav-trigger:hover, .drawer-close:hover { background: var(--soft); }
.theme-glyph { font-size: 22px; line-height: 1; }
.nav-trigger, .drawer-close { display: none; }
.sidebar {
  position: fixed; left: 0; top: var(--header); bottom: 0; width: var(--sidebar); z-index: 25;
  display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line);
}
.sidebar-head { padding: 25px 22px 16px; }
.sidebar-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sidebar-title h2 { margin: 0; font-size: 15px; font-weight: 700; }
.sidebar-title .count { color: var(--muted); font-size: 12px; }
.search-wrap { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); padding: 0 12px; gap: 9px; }
.search-wrap span { color: var(--muted); font-size: 21px; }
#search { background: transparent; border: 0; padding: 12px 0; width: 100%; min-width: 0; color: var(--text); font-size: 13px; }
#search::placeholder { color: var(--muted); opacity: .85; }
#search:focus { outline: none; }
.search-wrap:focus-within { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
.stage-list { padding: 0 12px 32px; overflow-y: auto; overscroll-behavior: contain; flex: 1; scrollbar-width: thin; }
.nav-group { margin-top: 9px; }
.nav-group > summary { list-style: none; cursor: pointer; padding: 13px 10px; color: var(--muted); font-size: 11px; line-height: 1.6; font-weight: 750; letter-spacing: .3px; display: flex; gap: 10px; align-items: center; }
.nav-group > summary::before { content: "⌄"; font-size: 14px; }
.nav-group:not([open]) > summary::before { content: "›"; }
.nav-group > summary::-webkit-details-marker { display: none; }
.stage-button { display: flex; align-items: baseline; gap: 12px; text-align: left; width: 100%; padding: 12px 10px; border-radius: 10px; background: transparent; font-size: 13px; line-height: 1.55; margin: 2px 0; }
.stage-button:hover { background: var(--soft); }
.stage-button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.stage-number { font-size: 11px; color: var(--muted); min-width: 23px; font-variant-numeric: tabular-nums; }
.stage-button[aria-current="page"] .stage-number { color: var(--accent); }
.no-results { color: var(--muted); padding: 25px 12px; font-size: 13px; }
.sidebar-foot { padding: 14px 22px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
main { margin-left: var(--sidebar); margin-top: var(--header); min-height: calc(100vh - var(--header)); padding: 45px clamp(24px, 4.5vw, 76px) 120px; }
.reader { max-width: 940px; margin: 0 auto; }
.breadcrumb { color: var(--muted); font-size: 12px; line-height: 1.8; margin: 0 0 20px; }
.breadcrumb span { margin: 0 7px; opacity: .5; }
.stage-hero { padding: 0 0 30px; }
.stage-kicker { color: var(--accent); font-size: 11px; text-transform: uppercase; font-weight: 750; letter-spacing: 1.8px; margin: 0 0 13px; }
h1 { margin: 0; max-width: 850px; font-size: clamp(26px, 2.8vw, 39px); font-weight: 730; line-height: 1.3; letter-spacing: -1.1px; text-wrap: balance; }
.objective { max-width: 710px; color: var(--muted); font-size: 16px; line-height: 1.85; margin: 18px 0 22px; }
.stage-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; font-size: 12px; color: var(--muted); }
.stage-meta .accent-button { margin-right: 3px; }
.accent-button { background: var(--accent); color: var(--surface); border-radius: 10px; padding: 12px 18px; font-weight: 650; font-size: 13px; }
.accent-button:hover { filter: brightness(1.08); }
.toolbar { position: sticky; top: calc(var(--header) + 10px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--bg); border-bottom: 1px solid var(--line); padding: 15px 0; margin-bottom: 25px; }
.toolbar h2 { margin: 0; font-size: 14px; font-weight: 700; }
.toolbar small { color: var(--muted); font-size: 11px; display: block; margin-top: 5px; }
.filter-anchor { position: relative; }
.filter-button { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); padding: 10px 13px; border-radius: 10px; white-space: nowrap; font-size: 12px; font-weight: 600; }
.filter-button:hover { border-color: var(--accent); }
.filter-panel { position: absolute; top: calc(100% + 9px); right: 0; width: 320px; padding: 17px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); box-shadow: var(--shadow); }
.filter-panel-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
.text-button { background: transparent; color: var(--accent); font-size: 12px; padding: 7px; }
.filter-row { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 12px; }
.filter-row input { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; }
.filter-row .filter-count { margin-left: auto; font-size: 11px; color: var(--muted); }
.icon { display: inline-grid; place-items: center; flex-shrink: 0; width: 39px; height: 39px; border-radius: 12px; font-weight: 700; font-size: 19px; color: var(--kind); background: var(--soft); background: color-mix(in srgb, var(--kind) 11%, var(--surface)); }
.icon.small { width: 26px; height: 26px; border-radius: 7px; font-size: 14px; }
.kind-vocabulary { --kind: #328575; }
.kind-speak_video { --kind: #8a65b7; }
.kind-speak_shadow { --kind: #6882c8; }
.kind-shadowing { --kind: #b18131; }
.kind-reading { --kind: #7f8d4c; }
.kind-lecture { --kind: #507ea0; }
.kind-situations { --kind: #b77867; }
.kind-challenge { --kind: #b67a9d; }
.kind-free { --kind: #668b81; }
:root[data-theme="dark"] .icon { color: color-mix(in srgb, var(--kind) 60%, #fff); }
.lesson { margin: 0 0 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 15px; scroll-margin-top: calc(var(--header) + 98px); }
.lesson > summary { list-style: none; display: flex; align-items: center; gap: 15px; padding: 20px; cursor: pointer; }
.lesson > summary::-webkit-details-marker { display: none; }
.lesson > summary::after { content: "+"; margin-left: auto; flex-shrink: 0; color: var(--muted); font-size: 21px; font-weight: 300; }
.lesson[open] > summary::after { content: "−"; }
.lesson[open] { border-color: color-mix(in srgb, var(--accent) 36%, var(--line)); }
.lesson[open] > summary { border-bottom: 1px solid var(--line); }
.lesson-label { font-size: 10px; color: var(--muted); margin-bottom: 5px; letter-spacing: .3px; }
.lesson h3 { font-size: 16px; line-height: 1.6; font-weight: 650; margin: 0; overflow-wrap: anywhere; }
.lesson-body { padding: 25px; line-height: 1.85; }
.lesson-body > :first-child { margin-top: 0; }
.reading { font-size: 16px; line-height: 1.95; overflow-wrap: anywhere; }
.reading h1, .reading h2 { font-size: 23px; line-height: 1.65; letter-spacing: -.4px; }
.reading h3 { font-size: 19px; margin: 25px 0 10px; }
.reading p { margin: 12px 0; }
.reading strong { font-weight: 650; }
.reading ul, .reading ol { padding-left: 23px; }
.reading li { margin-bottom: 10px; }
.reading table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; font-size: 14px; }
.reading th, .reading td { padding: 10px 14px; border: 1px solid var(--line); vertical-align: top; }
.reading blockquote { border-left: 3px solid var(--accent); margin: 20px 0; padding-left: 18px; color: var(--muted); }
.reading code { font-size: .88em; padding: 2px 4px; border-radius: 4px; background: var(--soft); }
.reading pre { overflow-x: auto; }
.vocabulary-groups { display: flex; flex-wrap: wrap; gap: 9px; padding: 0; margin: 0; list-style: none; }
.vocabulary-groups li { background: var(--soft); border-radius: 8px; padding: 8px 13px; font-size: 14px; }
.quiet { color: var(--muted); font-size: 13px; }
.placeholder { display: grid; place-items: center; text-align: center; gap: 9px; padding: 33px 18px; background: var(--bg); border: 1px dashed var(--line); border-radius: 11px; color: var(--muted); font-size: 13px; }
.placeholder .placeholder-icon { font-size: 26px; color: var(--kind); opacity: .7; }
.provenance { border-top: 1px solid var(--line); margin-top: 28px; padding-top: 15px; color: var(--muted); font-size: 12px; }
.provenance > summary { cursor: pointer; font-weight: 650; }
.provenance p { margin: 11px 0; overflow-wrap: anywhere; }
.provenance code { font-size: 10px; display: block; white-space: normal; overflow-wrap: anywhere; }
.provenance .quality { border-left: 3px solid #bd8b43; padding-left: 12px; }
.event { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; padding: 0 16px; }
.event > summary { cursor: pointer; padding: 13px 0; font-weight: 650; font-size: 14px; }
.roles { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
.scenario-list { list-style: none; padding: 0; margin: 0; }
.scenario-list li { padding: 14px 0; border-top: 1px solid var(--line); font-size: 14px; }
.scenario-meta { display: flex; gap: 9px; margin-top: 6px; color: var(--muted); font-size: 11px; }
.stage-nav { position: fixed; bottom: 0; left: var(--sidebar); right: 0; z-index: 18; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 28px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
.stage-nav button { background: var(--soft); border-radius: 9px; padding: 11px 17px; font-size: 12px; font-weight: 650; }
.stage-nav button:last-child { background: var(--accent); color: var(--surface); }
.stage-position { color: var(--muted); font-size: 11px; }
.empty-state { padding: 35px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); line-height: 1.8; }
.overlay { display: none; }
@media (min-width: 1600px) { :root { --sidebar: 360px; } }
@media (max-width: 1100px) {
  :root { --sidebar: 294px; }
  .topbar { gap: 15px; padding-right: 18px; }
  .level-tab { min-width: 78px; padding: 10px 13px; }
  .theme-caption { display: none; }
}
@media (max-width: 850px) {
  :root { --header: 122px; --sidebar: 320px; }
  .topbar { height: var(--header); padding: 0 16px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: 65px 57px; gap: 0; }
  .brand { width: auto; gap: 10px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; font-size: 20px; }
  .brand strong { font-size: 18px; }
  .brand small { font-size: 9px; margin-top: 1px; }
  .header-tools { grid-column: 2; grid-row: 1; gap: 2px; }
  .level-tabs { grid-column: 1 / -1; grid-row: 2; margin-bottom: 9px; padding: 4px; }
  .level-tab { flex: 1; min-width: 0; padding: 8px; font-size: 13px; }
  .version { font-size: 10px; }
  .nav-trigger { display: inline-flex; font-size: 18px; padding: 8px 10px; }
  .theme-button { padding: 8px 10px; }
  .sidebar { z-index: 50; top: 0; width: min(88vw, 365px); transform: translateX(-103%); transition: transform .2s ease; box-shadow: var(--shadow); }
  body.drawer-open .sidebar { transform: translateX(0); }
  .drawer-close { display: inline-flex; font-size: 23px; margin-left: auto; }
  .sidebar-head { padding-top: 17px; }
  .sidebar-title { margin-bottom: 8px; }
  .sidebar-title .count { margin-left: 10px; }
  body.drawer-open .overlay { display: block; position: fixed; inset: 0; z-index: 45; background: #07100bb0; backdrop-filter: blur(2px); }
  main { margin-left: 0; padding: 29px 20px 105px; }
  .breadcrumb { margin-bottom: 18px; font-size: 11px; }
  h1 { font-size: 29px; letter-spacing: -.8px; }
  .objective { font-size: 14px; line-height: 1.85; margin-bottom: 18px; }
  .stage-hero { padding-bottom: 15px; }
  .stage-meta { gap: 12px; font-size: 11px; }
  .accent-button { padding: 11px 14px; font-size: 12px; }
  .toolbar { top: var(--header); padding: 14px 0; margin-bottom: 18px; }
  .toolbar h2 { font-size: 13px; }
  .filter-panel { width: min(320px, calc(100vw - 40px)); }
  .lesson { border-radius: 12px; margin-bottom: 11px; }
  .lesson > summary { padding: 16px 14px; gap: 11px; }
  .lesson h3 { font-size: 14px; }
  .icon { width: 34px; height: 34px; border-radius: 10px; font-size: 17px; }
  .lesson-body { padding: 18px 16px; }
  .reading { font-size: 15px; }
  .reading h1, .reading h2 { font-size: 20px; }
  .reading h3 { font-size: 17px; }
  .stage-nav { left: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .stage-nav button { font-size: 12px; padding: 11px 14px; }
  .stage-position { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Đến nội dung</a>
<header class="topbar" id="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">話</span><div><strong>Harumii</strong><small>KAIWA ROADMAP</small></div></div>
  <div class="level-tabs" role="tablist" aria-label="Cấp độ"></div>
  <div class="header-tools">
    <span class="version" id="version"></span>
    <button type="button" class="theme-button" id="theme"><span class="theme-glyph" aria-hidden="true"></span><span class="theme-caption"></span></button>
    <button type="button" class="nav-trigger" id="open-nav" aria-label="Chọn chặng" aria-expanded="false" aria-controls="sidebar">☰</button>
  </div>
</header>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar" aria-label="Danh sách chặng">
  <div class="sidebar-head">
    <div class="sidebar-title"><h2 id="nav-title">Lộ trình của bạn</h2><span class="count" id="nav-count"></span><button class="drawer-close" id="close-nav" aria-label="Đóng danh sách chặng">×</button></div>
    <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="Tìm chặng" placeholder="Tìm chặng, chủ đề, tình huống…" autocomplete="off"></label>
  </div>
  <nav class="stage-list" id="stage-list" aria-label="Các chặng"></nav>
  <div class="sidebar-foot"><span>289 chặng · luyện nghe & nói</span><span id="nav-version"></span></div>
</aside>
<main id="main" tabindex="-1"><div class="reader">
  <div id="stage-heading"></div>
  <div class="toolbar">
    <div><h2>Nội dung chặng</h2><small id="visible-count" aria-live="polite"></small></div>
    <div class="filter-anchor">
      <button class="filter-button" id="filter-button" aria-expanded="false" aria-controls="filter-panel"><span aria-hidden="true">☷</span><span id="filter-label">Loại bài</span><span aria-hidden="true">⌄</span></button>
      <div class="filter-panel" id="filter-panel" hidden><div class="filter-panel-head"><strong>Hiển thị loại bài</strong><button class="text-button" id="reset-filters">Bật tất cả</button></div><div id="filter-options"></div></div>
    </div>
  </div>
  <div id="lessons"></div>
  <div id="empty-filter" class="empty-state" hidden>Bạn đang ẩn các loại bài trong chặng này.<br><button class="text-button" id="empty-reset">Bật tất cả loại bài</button></div>
</div></main>
<nav class="stage-nav" aria-label="Chuyển chặng"><button id="previous">← Chặng trước</button><span class="stage-position" id="stage-position"></span><button id="next">Chặng tiếp →</button></nav>
<script id="course-data" type="application/json">__COURSE_DATA__</script>
<script>
"use strict";
const course = JSON.parse(document.getElementById("course-data").textContent);
const levels = [...new Set(course.stages.map(stage => stage.level))];
const types = {
  vocabulary: { label: "Từ vựng", icon: "字" },
  speak_video: { label: "Video Speak Japanese", icon: "▶" },
  speak_shadow: { label: "Shadowing Speak Japanese", icon: "♫" },
  shadowing: { label: "Shadowing", icon: "◖" },
  reading: { label: "Tài liệu bổ trợ", icon: "▤" },
  lecture: { label: "Video kiến thức chặng", icon: "▣" },
  situations: { label: "Thực hành tình huống", icon: "☏" },
  challenge: { label: "Challenge Live AI", icon: "ϟ" },
  free: { label: "Free Kaiwa", icon: "✦" }
};
const byId = new Map(course.stages.map(stage => [stage.uid, stage]));
const stageLists = Object.fromEntries(levels.map(level => [level, course.stages.filter(s => s.level === level)]));
const $ = id => document.getElementById(id);
function make(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}
function button(text, handler, className) {
  const element = make("button", className, text);
  element.type = "button";
  element.addEventListener("click", handler);
  return element;
}
function readPreference(key, fallback) {
  try { return JSON.parse(localStorage.getItem("kaiwa-review:" + key)) ?? fallback; }
  catch { return fallback; }
}
function savePreference(key, value) {
  try { localStorage.setItem("kaiwa-review:" + key, JSON.stringify(value)); }
  catch { /* Reading remains available when storage is disabled. */ }
}
function icon(type, small = false) {
  const element = make("span", "icon kind-" + type + (small ? " small" : ""), types[type].icon);
  element.setAttribute("aria-hidden", "true");
  return element;
}
function fold(text) {
  return text.normalize("NFD").replace(/\p{M}/gu, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
}
let enabled = Object.fromEntries(Object.keys(types).map(type => [type, true]));
const rememberedFilters = readPreference("filters", {});
for (const type of Object.keys(types)) {
  if (typeof rememberedFilters[type] === "boolean") enabled[type] = rememberedFilters[type];
}
const savedLevels = readPreference("lastByLevel", {});
const lastByLevel = savedLevels && typeof savedLevels === "object" && !Array.isArray(savedLevels) ? savedLevels : {};
let current = null;
let currentNodes = [];
let drawerReturnFocus = null;
function readStageId() {
  const hashId = new URLSearchParams(location.hash.slice(1)).get("stage");
  return byId.has(hashId) ? hashId : readPreference("lastStage", null);
}
function nodesFor(stage) {
  const selections = new Map(stage.selections.map(s => [s.book_id + "/" + s.pack_id, s]));
  const result = [];
  for (const item of stage.order) {
    const selection = item.pack_id ? selections.get(item.book_id + "/" + item.pack_id) : null;
    let kind, title;
    switch (item.type) {
      case "vocabulary_topics": kind = "vocabulary"; title = "Từ vựng theo chủ đề"; break;
      case "speak_japanese_video": kind = "speak_video"; title = selection.title; break;
      case "speak_japanese_examples": kind = selection.support ? "reading" : "speak_shadow"; title = selection.title; break;
      case "independent_shadowing": kind = selection.support ? "reading" : "shadowing"; title = selection.title; break;
      case "stage_lecture": kind = "lecture"; title = "Kiến thức tổng hợp của chặng"; break;
      case "v5_situations": kind = "situations"; title = "Các tình huống thực hành"; break;
      case "live_challenges": kind = "challenge"; title = "Vận dụng cùng Live AI"; break;
      case "free_kaiwa": kind = "free"; title = "Trò chuyện tự do"; break;
      default: continue;
    }
    result.push({ kind, title, selection, id: "lesson-" + result.length });
  }
  return result;
}
function renderTabs() {
  const container = document.querySelector(".level-tabs");
  container.replaceChildren();
  for (const level of levels) {
    const tab = button(level, () => selectLevel(level), "level-tab");
    tab.append(make("span", "", stageLists[level].length));
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", String(level === current.level));
    tab.tabIndex = level === current.level ? 0 : -1;
    tab.addEventListener("keydown", event => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      let index = levels.indexOf(level);
      if (event.key === "ArrowLeft") index = (index + levels.length - 1) % levels.length;
      if (event.key === "ArrowRight") index = (index + 1) % levels.length;
      if (event.key === "Home") index = 0;
      if (event.key === "End") index = levels.length - 1;
      selectLevel(levels[index]);
      container.querySelector('[aria-selected="true"]').focus();
    });
    container.append(tab);
  }
}
function selectLevel(level) {
  $("search").value = "";
  const remembered = lastByLevel[level];
  const stage = byId.get(remembered);
  navigate(stage && stage.level === level ? stage.uid : stageLists[level][0].uid);
}
function renderNavigation() {
  const nav = $("stage-list");
  const query = fold($("search").value.trim());
  const stages = stageLists[current.level].filter(stage => !query || fold([
    stage.title, stage.cluster, stage.code,
    ...stage.situations.map(s => s.title), ...stage.selections.map(s => s.title)
  ].join(" ")).includes(query));
  nav.replaceChildren();
  $("nav-count").textContent = stages.length + " chặng";
  let group = null, cluster = null;
  for (const stage of stages) {
    if (cluster !== stage.cluster_id) {
      group = make("details", "nav-group");
      group.open = true;
      group.append(make("summary", "", stage.cluster));
      nav.append(group);
      cluster = stage.cluster_id;
    }
    const item = button("", () => navigate(stage.uid), "stage-button");
    item.append(make("span", "stage-number", String(stage.number).padStart(2, "0")), make("span", "", stage.title));
    if (stage.uid === current.uid) item.setAttribute("aria-current", "page");
    group.append(item);
  }
  if (!stages.length) nav.append(make("p", "no-results", "Không tìm thấy chặng phù hợp. Thử từ khóa khác."));
  const selected = nav.querySelector('[aria-current="page"]');
  if (selected) {
    const top = selected.getBoundingClientRect().top - nav.getBoundingClientRect().top + nav.scrollTop;
    nav.scrollTop = Math.max(0, top - nav.clientHeight * .35);
  }
}
function renderHeading() {
  const container = $("stage-heading");
  container.replaceChildren();
  const breadcrumb = make("div", "breadcrumb");
  breadcrumb.append(document.createTextNode("Lộ trình"), make("span", "", "/"), document.createTextNode(current.cluster));
  const hero = make("section", "stage-hero");
  hero.append(make("p", "stage-kicker", "Chặng " + String(current.number).padStart(2, "0")));
  hero.append(make("h1", "", current.title), make("p", "objective", current.objective));
  const meta = make("div", "stage-meta");
  meta.append(button("Đọc chặng này ↗", () => {
    const first = [...$("lessons").children].find(section =>
      !section.hidden && ["reading", "shadowing", "speak_shadow"].includes(section.dataset.kind));
    if (first) { first.open = true; first.scrollIntoView({ behavior: "smooth", block: "start" }); }
  }, "accent-button"));
  meta.append(make("span", "", current.selections.length + " bài bổ trợ"), make("span", "", current.situations.length + " tình huống"));
  const link = make("a", "", "Liên kết chặng");
  link.href = "#stage=" + current.uid;
  meta.append(link);
  hero.append(meta);
  container.append(breadcrumb, hero);
}
function renderProvenance(selection) {
  const p = selection.provenance;
  const detail = make("details", "provenance");
  detail.append(make("summary", "", "Nguồn & ghi chú biên tập"));
  detail.append(make("p", "", selection.book_id + " · " + p.book_title), make("p", "", p.title_ja));
  detail.append(make("p", "", p.boundary));
  detail.append(make("code", "", p.path + " · " + p.unit_id + " · dòng " + p.start_line + "–" + p.end_line));
  for (const extra of p.extra_parts || []) {
    detail.append(make("code", "", extra.path + " · dòng " + extra.start_line + "–" + extra.end_line));
  }
  for (const audio of p.audio || []) {
    detail.append(make("p", "", [audio.disc, audio.track, audio.locator].filter(Boolean).join(" · ")));
  }
  detail.append(make("p", "", p.audio_note), make("p", "", p.fit_vi), make("p", "", p.difficulty_vi));
  if (p.source_quality_note) detail.append(make("p", "quality", p.source_quality_note));
  return detail;
}
function placeholder(glyph, text) {
  const container = make("div", "placeholder");
  container.append(make("span", "placeholder-icon", glyph), make("span", "", text));
  return container;
}
function renderBody(node, body) {
  switch (node.kind) {
    case "vocabulary": {
      const list = make("ul", "vocabulary-groups");
      for (const topic of current.vocabulary) list.append(make("li", "", topic));
      body.append(list, make("p", "quiet", "Các nhóm từ đã định hướng. Danh sách từ cụ thể sẽ được bổ sung khi biên soạn bài."));
      break;
    }
    case "speak_video":
      body.append(placeholder("▶", "Video bài giảng · Chờ gắn video"), renderProvenance(node.selection));
      break;
    case "speak_shadow":
    case "shadowing":
    case "reading": {
      const reading = make("div", "reading");
      reading.innerHTML = course.content[node.selection.content_key];
      body.append(reading, renderProvenance(node.selection));
      break;
    }
    case "lecture":
      body.append(placeholder("▣", "Video kiến thức tổng hợp · Chờ biên soạn"));
      break;
    case "situations":
      body.append(make("p", "quiet", current.situations.length + " tình huống đã lên khung. Hội thoại thực hành sẽ được biên soạn ở bước tiếp theo."));
      for (const event of current.events) {
        const details = make("details", "event");
        details.append(make("summary", "", event.name), make("p", "roles", event.roles.join(" ↔ ")));
        const list = make("ul", "scenario-list");
        for (const scenario of current.situations.filter(s => s.event_id === event.id)) {
          const item = make("li");
          item.append(make("div", "", scenario.title));
          const meta = make("div", "scenario-meta");
          meta.append(make("span", "", course.branches[scenario.branch] || scenario.branch));
          if (scenario.continues_from?.length) {
            meta.append(make("span", "", "Tiếp từ " + scenario.continues_from.join(", ")));
          }
          item.append(meta);
          list.append(item);
        }
        details.append(list);
        body.append(details);
      }
      break;
    case "challenge":
      body.append(placeholder("ϟ", "Challenge tổng hợp cùng Live AI · Chờ biên soạn nhiệm vụ"));
      break;
    case "free":
      body.append(placeholder("✦", "Free Kaiwa cuối chặng · Chờ chuẩn bị context trò chuyện"));
      break;
  }
}
function renderLessons() {
  const container = $("lessons");
  container.replaceChildren();
  for (const node of currentNodes) {
    const detail = make("details", "lesson kind-" + node.kind);
    detail.id = node.id;
    detail.dataset.kind = node.kind;
    const summary = make("summary");
    const title = make("div");
    title.append(make("div", "lesson-label", types[node.kind].label), make("h3", "", node.title));
    summary.append(icon(node.kind), title);
    const body = make("div", "lesson-body");
    let loaded = false;
    detail.addEventListener("toggle", () => {
      if (detail.open && !loaded) { renderBody(node, body); loaded = true; }
    });
    detail.append(summary, body);
    container.append(detail);
  }
  renderFilters();
  applyFilters();
}
function renderFilters() {
  const container = $("filter-options");
  container.replaceChildren();
  for (const [kind, type] of Object.entries(types)) {
    const row = make("label", "filter-row");
    const checkbox = make("input");
    checkbox.type = "checkbox";
    checkbox.checked = enabled[kind];
    checkbox.dataset.kind = kind;
    checkbox.addEventListener("change", () => {
      enabled[kind] = checkbox.checked;
      savePreference("filters", enabled);
      applyFilters();
    });
    const count = kind === "situations" ? current.situations.length : currentNodes.filter(n => n.kind === kind).length;
    row.append(checkbox, icon(kind, true), make("span", "", type.label), make("span", "filter-count", count));
    container.append(row);
  }
}
function applyFilters() {
  let visible = 0;
  for (const lesson of $("lessons").children) {
    lesson.hidden = !enabled[lesson.dataset.kind];
    if (!lesson.hidden) visible++;
  }
  const totalTypes = Object.keys(types).length;
  const shownTypes = Object.values(enabled).filter(Boolean).length;
  $("filter-label").textContent = "Loại bài · " + shownTypes + "/" + totalTypes;
  $("visible-count").textContent = visible + "/" + currentNodes.length + " mục đang hiển thị";
  $("empty-filter").hidden = visible > 0;
  document.querySelector(".accent-button").disabled = visible === 0;
}
function resetFilters() {
  for (const key of Object.keys(enabled)) enabled[key] = true;
  savePreference("filters", enabled);
  renderFilters();
  applyFilters();
}
function closeFilters() {
  $("filter-panel").hidden = true;
  $("filter-button").setAttribute("aria-expanded", "false");
}
function setDrawer(open) {
  const mobile = matchMedia("(max-width: 850px)").matches;
  if (!mobile) open = false;
  if (open) drawerReturnFocus = document.activeElement;
  document.body.classList.toggle("drawer-open", open);
  $("open-nav").setAttribute("aria-expanded", String(open));
  $("sidebar").inert = mobile && !open;
  $("main").inert = open;
  $("topbar").inert = open;
  document.querySelector(".stage-nav").inert = open;
  if (open) {
    $("sidebar").setAttribute("role", "dialog");
    $("sidebar").setAttribute("aria-modal", "true");
    $("close-nav").focus();
  } else {
    $("sidebar").removeAttribute("role");
    $("sidebar").removeAttribute("aria-modal");
    if (drawerReturnFocus && mobile) drawerReturnFocus.focus();
    drawerReturnFocus = null;
  }
}
function navigate(uid) {
  if (!byId.has(uid)) return;
  if (new URLSearchParams(location.hash.slice(1)).get("stage") !== uid) location.hash = "stage=" + uid;
  showStage(uid);
}
function showStage(uid) {
  current = byId.get(uid) || course.stages[0];
  currentNodes = nodesFor(current);
  lastByLevel[current.level] = current.uid;
  savePreference("lastByLevel", lastByLevel);
  savePreference("lastStage", current.uid);
  renderTabs();
  renderNavigation();
  renderHeading();
  renderLessons();
  closeFilters();
  setDrawer(false);
  const stages = stageLists[current.level];
  const index = stages.findIndex(s => s.uid === current.uid);
  $("previous").disabled = index === 0;
  $("next").disabled = index === stages.length - 1;
  $("stage-position").textContent = current.level + " · " + (index + 1) + " / " + stages.length;
  window.scrollTo({ top: 0, behavior: "instant" });
}
function themeButton() {
  const dark = document.documentElement.dataset.theme === "dark";
  $("theme").setAttribute("aria-label", dark ? "Chuyển sang chế độ sáng" : "Chuyển sang chế độ tối");
  $("theme").setAttribute("aria-pressed", String(dark));
  $("theme").querySelector(".theme-glyph").textContent = dark ? "☀" : "☾";
  $("theme").querySelector(".theme-caption").textContent = dark ? "Sáng" : "Tối";
  document.querySelector('meta[name="theme-color"]').content = dark ? "#101b18" : "#f7f8f5";
}
$("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("kaiwa-review:theme", next); } catch { /* Optional preference. */ }
  themeButton();
});
$("search").addEventListener("input", renderNavigation);
$("filter-button").addEventListener("click", () => {
  const hidden = $("filter-panel").hidden;
  $("filter-panel").hidden = !hidden;
  if (hidden) {
    const footerHeight = document.querySelector(".stage-nav").getBoundingClientRect().height;
    const available = innerHeight - $("filter-button").getBoundingClientRect().bottom - footerHeight - 24;
    $("filter-panel").style.maxHeight = Math.max(100, available) + "px";
    $("filter-panel").style.overflowY = "auto";
  }
  $("filter-button").setAttribute("aria-expanded", String(hidden));
});
$("reset-filters").addEventListener("click", resetFilters);
$("empty-reset").addEventListener("click", resetFilters);
document.addEventListener("click", event => {
  if (!event.target.closest(".filter-anchor")) closeFilters();
});
$("open-nav").addEventListener("click", () => setDrawer(true));
$("close-nav").addEventListener("click", () => setDrawer(false));
$("overlay").addEventListener("click", () => setDrawer(false));
document.addEventListener("keydown", event => {
  if (event.key === "Escape") { closeFilters(); setDrawer(false); }
  if (event.key === "Tab" && document.body.classList.contains("drawer-open")) {
    const focusable = [...$("sidebar").querySelectorAll('button,input,summary')].filter(el => el.getClientRects().length);
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});
matchMedia("(max-width: 850px)").addEventListener("change", () => setDrawer(false));
$("previous").addEventListener("click", () => {
  const list = stageLists[current.level], index = list.findIndex(s => s.uid === current.uid);
  if (index > 0) navigate(list[index - 1].uid);
});
$("next").addEventListener("click", () => {
  const list = stageLists[current.level], index = list.findIndex(s => s.uid === current.uid);
  if (index < list.length - 1) navigate(list[index + 1].uid);
});
window.addEventListener("hashchange", () => {
  const id = readStageId();
  if (id !== current.uid) showStage(id);
});
document.querySelector(".sidebar-foot span").textContent = course.stages.length + " chặng · luyện nghe & nói";
$("version").textContent = "V" + course.version;
$("nav-version").textContent = "V" + course.version;
themeButton();
showStage(readStageId());
</script>
</body>
</html>
