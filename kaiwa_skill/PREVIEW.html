<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harumii · Lộ trình Kaiwa</title>
    <script>
      // Apply the saved preference before the first paint, including local-file previews.
      try {
        const savedTheme = localStorage.getItem("harumii-preview-theme");
        document.documentElement.dataset.theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme =
          matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --paper: #faf9f6;
        --surface: #fff;
        --ink: #242338;
        --muted: #737183;
        --line: #e9e6ef;
        --accent: #7460c4;
        --soft: #f0ebfc;
        --green: #35866d;
        --tab: #faf8fe;
        --status: #f4f1fa;
        --success: #e9f5ee;
        --danger: #a5324a;
        --danger-bg: #fff3f4;
        --danger-line: #efd5db;
        --sentence: #f8f7fb;
        --bubble-a: #f6f3fc;
        --bubble-b: #f2f7f4;
        --avatar-a: #eee8fa;
        --avatar-b: #e5f1ed;
        --word: #fdfcfa;
        --video-bg: #faf7ff;
        --video-ink: #7d689e;
        --finish: #eeebf7;
        --icon-knowledge: #f0eaff;
        --icon-vocabulary: #fff1dc;
        --icon-grammar: #e6f4ed;
        --icon-situation: #e6f0ff;
        --icon-shadowing: #fff0ee;
        --icon-live: #f8e8f6;
        --icon-free: #e6f5f3;
        --radius: 18px;
        font-family: Inter, "Segoe UI", sans-serif;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #15151d;
        --surface: #1f1f2a;
        --ink: #eceaf4;
        --muted: #b4b0c4;
        --line: #3b384c;
        --accent: #b9a5ff;
        --soft: #322943;
        --green: #91d5b8;
        --tab: #252130;
        --status: #211d2b;
        --success: #233c32;
        --danger: #ffb0bb;
        --danger-bg: #3d242d;
        --danger-line: #76404f;
        --sentence: #292636;
        --bubble-a: #2d273c;
        --bubble-b: #24342e;
        --avatar-a: #3d3152;
        --avatar-b: #2c473b;
        --word: #282631;
        --video-bg: #2b2338;
        --video-ink: #c5b1ed;
        --finish: #2c263a;
        --icon-knowledge: #3d3054;
        --icon-vocabulary: #483a27;
        --icon-grammar: #284034;
        --icon-situation: #2a3b55;
        --icon-shadowing: #4b302f;
        --icon-live: #452d43;
        --icon-free: #23413c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.65;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      input, select {
        color: var(--ink);
        accent-color: var(--accent);
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      a {
        color: var(--accent);
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #b3a0ed;
        outline-offset: 3px;
      }
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        padding: 19px 4vw 0;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding-bottom: 15px;
      }
      .brand {
        font-size: 25px;
        font-weight: 750;
        letter-spacing: -1px;
        color: var(--accent);
      }
      .brand small {
        font-size: 13px;
        letter-spacing: 1.5px;

        color: var(--muted);
        margin-left: 14px;
      }
      .tools {

        gap: 8px;

        flex-wrap: wrap;

      .btn {
        border: 1px solid var(--line);

        padding: 8px 13px;
        border-radius: 10px;

      }

        border-color: var(--accent);
        background: var(--soft);
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .primary:hover {
        background: #6551b4;
        color: #fff;
      }
      .tabs {
        display: flex;
        gap: 5px;
        overflow: auto;
      }
      .tab {
        white-space: nowrap;
        border: 0;
        background: transparent;
        padding: 12px 18px;
        border-bottom: 3px solid transparent;
        font-size: 14px;
        color: var(--muted);
      }
      .tab[aria-selected="true"] {
        color: var(--accent);
        font-weight: 700;
        border-bottom-color: var(--accent);
      }
      .tab.pilot {
        background: var(--tab);
        border-radius: 10px 10px 0 0;
      }
      .tabs .tab:nth-child(4) {
        margin-left: 22px;
      }
      #status {
        font-size: 12px;
        color: var(--muted);

      .statusbar {
        padding: 9px 4vw;
        background: var(--status);

      .layout {

      .section-link,
      .node-link {

        border-radius: 10px;

      .node-link:hover {

      .section-link.active {

      .section-link span {

      .count {

        font-weight: 400;
      }
      .node-link.current {

      main {
        padding: 35px clamp(18px, 4vw, 58px) 80px;
        min-width: 0;
        width: 100%;
        max-width: 1280px;
      }
      h1 {
        font-size: clamp(25px, 3vw, 36px);
        line-height: 1.25;
        letter-spacing: -0.8px;
        margin: 8px 0 14px;
      }
      h2 {
        font-size: 21px;
        line-height: 1.4;
        margin: 0;
      }
      h3 {
        font-size: 17px;
        margin: 15px 0 8px;
      }
      .intro {
        color: var(--muted);
        max-width: 740px;
        margin: 0 0 22px;
        font-size: 15px;
      }
      .filters {
        display: flex;
        gap: 10px;
        margin: 23px 0 30px;
      }
      .filters input {
        flex: 1;
        min-width: 100px;
      }
      .filters input,
      .filters select {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 10px 13px;
        font-size: 14px;
      }
      .section {
        scroll-margin-top: 155px;
        margin: 0 0 36px;

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 15px;
      }
      .section-head h2 {
        font-size: 18px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;

      .stage-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 19px;
        text-align: left;
        display: flex;
        gap: 15px;
        align-items: flex-start;
        width: 100%;

      .stage-card:hover {

        transform: translateY(-2px);
      }

        display: grid;
        place-items: center;

        width: 43px;
        height: 43px;

      .stage-card.ready .orb {

        color: var(--green);
      }
      .stage-title {
        font-size: 15px;
        font-weight: 650;
        line-height: 1.5;
        display: block;
        margin: 4px 0 8px;

      .stage-code {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.5px;

      .availability {

        color: var(--muted);
      }
      .stage-card.ready .availability {
        color: var(--green);
      }
      .empty {

        border-radius: 20px;
        padding: 35px;
        text-align: center;
        background: var(--surface);
        max-width: 730px;
        margin: 35px auto;

      .empty h2 {
        margin-bottom: 12px;
      }
      .empty p {

        font-size: 14px;

        border-radius: 12px;

      .stage-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        color: var(--muted);

        margin-bottom: 12px;

      .pill {
        background: var(--soft);
        color: var(--accent);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 12px;
      }
      .lesson-heading {
        font-size: 13px;
        font-weight: 750;
        color: var(--muted);
        margin: 30px 0 12px;
        letter-spacing: 0.3px;
      }
      .node {
        scroll-margin-top: 155px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 25px;
        margin: 13px 0 20px;
      }
      .node-head {
        display: flex;
        align-items: flex-start;
        gap: 13px;
        margin-bottom: 19px;
      }
      .node-head h2 {
        font-size: 19px;
      }
      .icon {
        display: grid;
        place-items: center;
        border-radius: 12px;
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        font-size: 20px;
        background: var(--soft);
      }
      .type-label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .knowledge .icon {
        background: var(--icon-knowledge);
      }
      .vocabulary .icon {
        background: var(--icon-vocabulary);
      }
      .grammar .icon {
        background: var(--icon-grammar);
      }
      .situation .icon {
        background: var(--icon-situation);
      }
      .shadowing .icon {
        background: var(--icon-shadowing);
      }
      .live_challenge .icon {
        background: var(--icon-live);
      }
      .free_talk .icon {
        background: var(--icon-free);
      }
      .md {
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .md h1 {
        font-size: 22px;
        letter-spacing: -0.3px;
      }
      .md h2 {
        font-size: 19px;
        margin-top: 25px;
      }
      .md h3 {
        font-size: 17px;
      }
      .md p {
        margin: 12px 0;
      }
      .md ul,
      .md ol {
        padding-left: 24px;
      }
      .md blockquote {
        margin: 15px 0;
        border-left: 3px solid #c9bbe8;
        padding: 2px 15px;
        color: var(--muted);
      }
      .md code {
        background: var(--soft);
        padding: 2px 5px;
        border-radius: 4px;
      }
      .md pre {
        overflow: auto;
        background: var(--paper);
        padding: 15px;
      }
      .jp {
        font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
        font-size: 19px;
        line-height: 1.85;
        overflow-wrap: anywhere;
      }
      .vi {
        color: var(--muted);
        font-size: 14px;
        margin-top: 5px;
      }
      .hide-vi .vi {
        display: none;
      }
      .utterance {
        background: var(--sentence);
        border-radius: 11px;
        padding: 14px 17px;
        margin: 10px 0;
      }
      .turn {
        display: flex;
        gap: 11px;
        margin: 14px 0;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 29px;
        height: 29px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--avatar-a);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        margin-top: 4px;
      }
      .turn[data-speaker="B"] .avatar {
        background: var(--avatar-b);
        color: var(--green);
      }
      .turn .bubble {
        flex: 1;
        min-width: 0;
        background: var(--bubble-a);
        border-radius: 0 14px 14px;
        padding: 12px 16px;
      }
      .turn[data-speaker="B"] .bubble {
        background: var(--bubble-b);
      }
      .speaker {
        font-size: 11px;
        font-weight: 650;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .scene {
        border-left: 3px solid #b7a5e3;
        padding-left: 15px;
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 22px;
      }
      .word-list {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }
      .word {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 14px;
        font-size: 19px;
        background: var(--word);
      }
      .pattern {
        display: flex;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding: 14px 0;
        align-items: center;
      }
      .pattern:last-child {
        border: 0;
      }
      .pattern .jp {
        font-size: 18px;
      }
      .level-tag {
        background: var(--success);
        color: var(--green);
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 6px;
      }
      .video {
        border: 1px dashed #d4c7e9;
        background: var(--video-bg);
        border-radius: 12px;
        padding: 17px;
        color: var(--video-ink);
        font-size: 13px;
        margin-bottom: 20px;
      }
      .modebar {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
        margin: 15px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .modebar select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
        background: var(--surface);
      }
      .goal-list li {
        margin: 8px 0;
      }
      .variant-picker {
        width: 100%;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        margin: 10px 0 20px;
      }
      .note {
        font-size: 12px;
        color: var(--muted);
      }
      .sample {
        margin-top: 9px;
      }
      .sample summary {
        font-size: 12px;
        color: var(--accent);
        cursor: pointer;
      }
      .raw {
        margin-top: 24px;
        font-size: 12px;
      }
      .raw pre {
        max-height: 400px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--paper);
        padding: 16px;
      }
      .finish {
        background: var(--finish);
        border-radius: 16px;
        text-align: center;
        padding: 24px;
        margin-top: 28px;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      #openFiles {
        display: none;
      }
      .notice {
        font-size: 12px;
        color: var(--muted);
        max-width: 650px;
      }
      .switch {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .read-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin: 18px 0;
      }
      .node-nav-title {
        font-size: 11px;
        color: var(--muted);
        padding: 6px 10px;
      }
      .load-progress {
        height: 3px;
        background: var(--soft);
        overflow: hidden;
      }
      .load-progress::after {
        content: "";
        display: block;
        height: 3px;
        width: 40%;
        background: var(--accent);
        animation: loading 1.2s infinite;
      }
      @keyframes loading {
        to {
          transform: translateX(260%);
        }
      }
      @media (max-width: 1050px) {
        .layout {
          grid-template-columns: 280px minmax(0, 1fr);
        }
        .sidebar {
          padding: 25px 12px;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .brand small {
          display: none;
        }
      }
      @media (max-width: 720px) {
        header {
          position: static;
          padding: 15px 16px 0;
        }
        .topbar {
          align-items: flex-start;
          gap: 12px;
        }
        .brand {
          font-size: 22px;
        }
        .tools {
          justify-content: flex-end;
          gap: 5px;
        }
        .tools .btn {
          font-size: 12px;
          padding: 6px 9px;
        }
        .tab {
          padding: 10px 13px;
        }
        .tabs .tab:nth-child(4) {
          margin-left: 10px;
        }
        .statusbar {
          padding: 8px 16px;
          flex-direction: column;
          gap: 3px;
        }
        .layout {
          display: block;
        }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: 12px 16px;
        }
        .sidebar-inner {
          position: static;
          max-height: 150px;
        }
        .sidebar .eyebrow {
          display: none;
        }
        main {
          padding: 24px 16px 55px;
        }
        .node {
          padding: 19px 16px;
        }
        .node-head h2 {
          font-size: 17px;
        }
        .jp {
          font-size: 18px;
        }
        .filters {
          flex-wrap: wrap;
        }
        .node,
        .section {
          scroll-margin-top: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="topbar">
        <div class="brand">harumii <small>KAIWA</small></div>
        <div class="tools">
          <button class="btn" id="theme" type="button" aria-pressed="false">☾ Chế độ đêm</button>
          <button class="btn" id="folder">Chọn thư mục dữ liệu</button
          ><button class="btn" id="refresh">↻ Tải lại</button>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Cấp độ và pilot"></nav>
    </header>
    <div class="statusbar">
      <span id="status" role="status" aria-live="polite">Đang mở dữ liệu…</span
      ><span class="note" id="connection"></span>
    </div>
    <div id="progress" class="load-progress" hidden></div>
    <div class="layout">
      <aside class="sidebar"><div class="sidebar-inner" id="side"></div></aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <input type="file" id="openFiles" webkitdirectory multiple />
    <script>
      "use strict";
      // One renderer. Lesson content is read from the exported JSON entrypoints.
      const PILOTS = {
        beginner: ["da5c16e5-9425-5a4f-9086-8c109aa79c90", "72d35860-f51f-5d26-b6c8-489bed15a13f"],
        intermediate: ["2c4afb8d-e518-5c65-989e-076857a6ce9d", "50ef9531-2517-520a-930d-4379aff980ab"],
        advanced: ["cba953ce-d3d0-5e71-acb8-419cd0e708a1", "22840572-0228-51e3-a068-ef0e18149953"],
      };
      const LEVELS = {
        beginner: "Sơ cấp",
        intermediate: "Trung cấp",
        advanced: "Thượng cấp",
      };
      const TYPES = {
        knowledge: ["📖", "Kiến thức"],
        vocabulary: ["🗂", "Từ vựng"],
        grammar: ["🧩", "Ngữ pháp"],
        situation: ["💬", "Tình huống"],
        shadowing: ["🎧", "Shadowing"],
        live_challenge: ["⚡", "Challenge Live AI"],
        free_talk: ["✦", "Free talk"],
      };
      const TABS = [
        ...Object.keys(LEVELS),
        ...Object.keys(LEVELS).map((x) => "pilot-" + x),
      ];
      const state = {

      function markdown(text, data) {

          if (paragraph.length) {
            html += "<p>" + paragraph.map(inline).join("<br>") + "</p>";
            paragraph = [];
          }
          if (list) {
            html += "</" + list + ">";
            list = null;
          }
        }
        for (const line of lines) {
          if (line.startsWith("```")) {
            flush();
            if (code === null) code = [];
            else {
              html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
              code = null;
            }
            continue;
          }
          if (code !== null) {
            code.push(line);
            continue;
          }
          const token = line
            .trim()
            .match(/^\{\{utterance:([a-zA-Z0-9_-]+)\}\}$/);
          if (token) {
            flush();
            html += sentence(data, token[1]);
            continue;
          }
          const heading = line.match(/^(#{1,6})\s+(.+)/);
          if (heading) {
            flush();
            const depth = Math.min(heading[1].length, 4);
            html +=
              "<h" + depth + ">" + inline(heading[2]) + "</h" + depth + ">";
            continue;
          }
          const li = line.match(/^\s*(?:([-*])|\d+\.)\s+(.+)/);
          if (li) {
            if (paragraph.length) flush();
            const kind = li[1] ? "ul" : "ol";
            if (list !== kind) {

              html += "<" + kind + ">";
              list = kind;

            html += "<li>" + inline(li[2]) + "</li>";
            continue;
          }
          if (!line.trim()) {
            flush();
            continue;
          }
          if (line.startsWith("> ")) {
            flush();
            html += "<blockquote>" + inline(line.slice(2)) + "</blockquote>";
            continue;
          }
          if (list) flush();
          paragraph.push(line);
        }
        flush();
        if (code !== null)
          html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
        return html.replace(/\{\{utterance:([a-zA-Z0-9_-]+)\}\}/g, (_, uid) =>
          sentence(data, uid),

                      text: row.display_code + " · " + row.track_vi,
                    }),
                    el("span", { class: "stage-title", text: row.title_vi }),
                    el("span", {
                      class: "availability",
                      text: data
                        ? data.nodes.length + " bài · Mở chặng"
                        : err
                          ? "Cần kiểm tra gói dữ liệu"
                          : "Chờ biên soạn",
                    }),
                  ]),
                ],
              );
              card.onclick = () => openStage(row.stage_uid);
              cards.append(card);
            }
            section.append(cards);
            body.append(section);
            const nav = el("button", { class: "section-link" }, [
              el("span", { text: group.title }),
              el("small", { class: "count", text: filtered.length }),
            ]);
            nav.onclick = () =>
              section.scrollIntoView({ behavior: "smooth", block: "start" });
            side.append(nav);
          }
          if (!found)
            body.append(
              el("div", {
                class: "empty",
                text: "Chưa tìm thấy chặng phù hợp.",
              }),
            );
        }
        search.oninput = draw;
        select.onchange = draw;
        draw();
      }
      function render() {
        renderTabs();
        if (!state.catalog) {
          $("#side").replaceChildren();
          $("#main").replaceChildren(
            el("div", { class: "empty" }, [
              el("h2", { text: "Mở lộ trình Kaiwa" }),
              el("p", {
                text: "Chọn thư mục kaiwa_skill hoặc thư mục repo chứa kaiwa_skill. Trang sẽ đọc catalog và các gói JSON export mới nhất.",
              }),
              el("p", {
                class: "notice",
                text: "Trên Chrome hoặc Edge, thư mục được ghi nhớ. Khi trình duyệt yêu cầu, bấm Cho phép đọc để tải lại dữ liệu.",
              }),
            ]),
          );
          return;
        }
        const row = state.catalog.stages.find(
          (r) =>
            r.stage_uid === state.stage &&
            r.level === currentLevel() &&
            (!state.tab.startsWith("pilot-") ||
              PILOTS[r.level].includes(r.stage_uid)),
        );
        if (row) stageReader(row);
        else {
          state.stage = null;
          roadmap();
        }
      }
      function safePath(path) {
        const parts = path.split("/");
        if (
          parts.some((p) => !p || p === "." || p === ".." || p.includes("\\"))
        )
          throw Error("Đường dẫn dữ liệu không hợp lệ");
        return parts;
      }
      async function folderSource(handle) {
        let root = handle;
        try {
          root = await handle.getDirectoryHandle("kaiwa_skill");
        } catch (error) {
          if (error.name !== "NotFoundError") throw error;
        }
        return {
          label: root.name,
          async bytes(path) {
            const parts = safePath(path);
            let dir = root;
            for (const name of parts.slice(0, -1))
              dir = await dir.getDirectoryHandle(name);
            return new Uint8Array(
              await (
                await dir.getFileHandle(parts.at(-1))
              )
                .getFile()
                .then((f) => f.arrayBuffer()),
            );
          },
          async dirs(path) {
            let dir = root;
            try {
              for (const name of safePath(path))
                dir = await dir.getDirectoryHandle(name);
            } catch (e) {
              if (e.name === "NotFoundError") return [];
              throw e;
            }
            const names = [];
            for await (const [name, entry] of dir.entries())
              if (entry.kind === "directory") names.push(name);
            return names;
          },
        };
      }
      function httpSource() {
        const base = new URL("./", location.href);
        return {
          label: "JSON tại " + base.pathname,
          async bytes(path) {
            safePath(path);
            const response = await fetch(new URL(path, base), {
              cache: "no-store",
            });
            if (response.status === 404)
              throw new DOMException("Không tìm thấy " + path, "NotFoundError");
            if (!response.ok)
              throw Error("HTTP " + response.status + " · " + path);
            return new Uint8Array(await response.arrayBuffer());
          },
          async dirs(path) {
            safePath(path);
            const directory = new URL(path + "/", base);
            const response = await fetch(directory, { cache: "no-store" });
            if (!response.ok) return [];
            const doc = new DOMParser().parseFromString(
              await response.text(),
              "text/html",
            );
            return [...doc.querySelectorAll("a[href]")]
              .map((a) => {
                const url = new URL(a.getAttribute("href"), directory);
                if (
                  url.origin !== directory.origin ||
                  !url.pathname.startsWith(directory.pathname)
                )
                  return null;
                const name = decodeURIComponent(
                  url.pathname.slice(directory.pathname.length),
                );
                return /^[^/]+\/$/.test(name) ? name.slice(0, -1) : null;
              })
              .filter(Boolean);
          },
        };
      }
      function filesSource(files) {
        const map = new Map();
        for (const file of files) {
          const parts = file.webkitRelativePath.split("/");
          const index = parts.indexOf("kaiwa_skill");
          if (index >= 0) map.set(parts.slice(index + 1).join("/"), file);
          else map.set(parts.slice(1).join("/"), file);
        }
        return {
          label: "Thư mục đã chọn",
          async bytes(path) {
            if (!map.has(path))
              throw new DOMException("Không tìm thấy " + path, "NotFoundError");
            return new Uint8Array(await map.get(path).arrayBuffer());
          },
          async dirs(path) {
            return [
              ...new Set(
                [...map.keys()]
                  .filter((k) => k.startsWith(path + "/"))
                  .map((k) => k.slice(path.length + 1).split("/")[0]),
              ),
            ];
          },
        };
      }
      const decode = (bytes) =>
        new TextDecoder("utf-8", { fatal: true })
          .decode(bytes)
          .replace(/^\uFEFF/, "");
      async function json(path) {
        return JSON.parse(decode(await state.source.bytes(path)));
      }
      async function artifact(path, kind) {
        const manifest = await json(path + "/manifest.json");
        if (
          manifest.kind !== "artifact_manifest" ||
          manifest.schema_version !== "1.0.0"
        )
          throw Error("Manifest chưa hỗ trợ tại " + path);
        const entry = manifest.entrypoint;
        if (
          !["catalog.json", "stage.json"].includes(entry) ||
          !manifest.files?.[entry]
        )
          throw Error("Manifest thiếu entrypoint hợp lệ");
        const bytes = await state.source.bytes(path + "/" + entry);
        if (!crypto.subtle)
          throw Error(
            "Trình duyệt chưa hỗ trợ kiểm SHA-256; mở bằng Chrome/Edge hoặc localhost.",
          );
        const digest = Array.from(
          new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)),
          (x) => x.toString(16).padStart(2, "0"),
        ).join("");
        if (digest !== manifest.files[entry])
          throw Error("Checksum JSON sai tại " + path);
        const data = JSON.parse(decode(bytes));
        if (data.kind !== kind || data.schema_version !== "1.0.0")
          throw Error("Gói " + kind + " chưa hỗ trợ tại " + path);
        return data;
      }
      function validateStage(d, row) {
        if (
          d.stage_uid !== row.stage_uid ||
          d.course_id !== state.catalog.course_id ||
          d.level !== row.level ||
          d.display_code !== row.display_code ||
          !Number.isInteger(d.revision) ||
          d.revision < 1
        )
          throw Error("Gói chặng không khớp catalog");
        if (
          !Array.isArray(d.nodes) ||
          !Array.isArray(d.utterances) ||
          !Array.isArray(d.lessons)
        )
          throw Error("Thiếu nodes, utterances hoặc lessons");
        const ids = new Set(d.nodes.map((n) => n.id));
        const utterances = new Set(d.utterances.map((u) => u.id));
        if (
          ids.size !== d.nodes.length ||
          utterances.size !== d.utterances.length
        )
          throw Error("ID bị trùng trong gói");
        for (const u of d.utterances)
          if (typeof u.ja !== "string" || typeof u.vi !== "string")
            throw Error("Câu thiếu Nhật–Việt");
        for (const n of d.nodes) {
          if (!TYPES[n.type] || !n.data)
            throw Error("Loại bài chưa hỗ trợ " + n.type);
          if (n.type === "knowledge")
            for (const match of n.data.body_md.matchAll(
              /\{\{utterance:([a-zA-Z0-9_-]+)\}\}/g,
            ))
              if (!utterances.has(match[1]))
                throw Error("Thiếu câu " + match[1]);
          if (n.type === "free_talk" || n.type === "live_challenge")
            for (const id of n.data.context_node_ids)
              if (!ids.has(id)) throw Error("Thiếu context " + id);
        }
        return d;
      }
      async function loadStage(row) {
        const roots = [
          "harumii_export/" + row.stage_uid,
          "courseware/" + row.stage_uid + "/exports",
        ];
        let current = null;
        try {
          current = await json("courseware/" + row.stage_uid + "/current.json");
        } catch (e) {
          if (e.name !== "NotFoundError") throw e;
        }
        const candidates = [];
        for (const root of roots) {
          const dirs = await state.source.dirs(root);
          for (const rev of dirs)
            if (/^r\d{4,}$/.test(rev))
              candidates.push({
                path: root + "/" + rev,
                rev: Number(rev.slice(1)),
              });
          if (current?.revision && /^r\d{4,}$/.test(current.revision))
            candidates.push({
              path: root + "/" + current.revision,
              rev: Number(current.revision.slice(1)),
            });
        }
        candidates.sort((a, b) => b.rev - a.rev);
        const tried = new Set();
        let failure = null;
        for (const candidate of candidates) {
          if (tried.has(candidate.path)) continue;
          tried.add(candidate.path);
          try {
            const data = validateStage(
              await artifact(candidate.path, "stage"),
              row,
            );
            if (data.revision !== candidate.rev)
              throw Error("Revision trong gói khác thư mục");
            state.stages.set(row.stage_uid, data);
            state.paths.set(row.stage_uid, candidate.path + "/stage.json");
            if (failure)
              state.errors.set(
                row.stage_uid,
                "Đang hiển thị revision " +
                  data.revision +
                  ". Gói mới hơn cần kiểm tra: " +
                  failure,
              );
            return;
          } catch (e) {
            if (e.name !== "NotFoundError") failure = e.message;
          }
        }
        if (failure) state.errors.set(row.stage_uid, failure);
      }
      async function reload() {
        if (!state.source) return;
        const epoch = ++state.epoch;
        state.busy = true;
        $("#refresh").disabled = true;
        $("#folder").disabled = true;
        $("#progress").hidden = false;
        message("Đang đọc catalog và kiểm checksum các gói export…");
        state.stages.clear();
        state.paths.clear();
        state.errors.clear();
        try {
          const catalogFolders = (await state.source.dirs("harumii_export"))
            .filter((name) => /^catalog(?:[-_].+)?$/.test(name))
            .sort((a, b) => b.localeCompare(a, "en", { numeric: true }));
          // Static web hosts can disable directory listing. Keep the established
          // catalog path usable there as well as on a local file server.
          if (!catalogFolders.length) catalogFolders.push("catalog-v5");
          const catalog = await artifact(
            "harumii_export/" + catalogFolders[0],
            "catalog",
          );
          if (
            !Array.isArray(catalog.stages) ||
            new Set(catalog.stages.map((r) => r.stage_uid)).size !==
              catalog.stages.length
          )
            throw Error("Catalog thiếu danh sách chặng hoặc trùng UID");
          for (const row of catalog.stages)
            if (
              !LEVELS[row.level] ||
              !row.cluster_id ||
              !Number.isFinite(row.order)
            )
              throw Error("Catalog có cấp độ, cụm hoặc thứ tự không hợp lệ");
          state.catalog = {
            ...catalog,
            stages: [...catalog.stages].sort((a, b) => a.order - b.order),
          };
          let cursor = 0;
          const workers = Array.from({ length: 6 }, async () => {
            while (cursor < catalog.stages.length) {
              const row = state.catalog.stages[cursor++];
              try {
                await loadStage(row);
              } catch (e) {
                state.errors.set(row.stage_uid, e.message);
              }
            }
          });
          await Promise.all(workers);
          if (epoch !== state.epoch) return;
          render();
          message(
            state.catalog.stages.length +
              " chặng · " +
              state.stages.size +
              " gói nội dung · đọc lúc " +
              new Date().toLocaleTimeString("vi-VN") +
              (state.errors.size
                ? " · " + state.errors.size + " chặng cần kiểm tra"
                : ""),
          );
          $("#connection").textContent = state.source.label;
        } catch (e) {
          state.catalog = null;
          render();
          $("#main").append(problem("Không đọc được dữ liệu: " + e.message));
          message(
            "Chưa tải được lộ trình. Kiểm tra thư mục và catalog export.",
          );
        } finally {
          state.busy = false;
          $("#refresh").disabled = false;
          $("#folder").disabled = false;
          $("#progress").hidden = true;
        }
      }
      async function storedHandle(value) {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("harumii-kaiwa-preview", 1);
          request.onupgradeneeded = () =>
            request.result.createObjectStore("settings");
          request.onerror = () => reject(request.error);
          request.onsuccess = () => {
            const db = request.result;
            const transaction = db.transaction(
              "settings",
              value ? "readwrite" : "readonly",
            );
            const operation = value
              ? transaction.objectStore("settings").put(value, "folder")
              : transaction.objectStore("settings").get("folder");
            let result;
            operation.onsuccess = () => {
              result = operation.result;
            };
            transaction.oncomplete = () => {
              db.close();
              resolve(result);
            };
            transaction.onerror = () => {
              db.close();
              reject(transaction.error);
            };
          };
        });
      }
      const themeButton = $("#theme");
      function showThemeButton() {
        const dark = document.documentElement.dataset.theme === "dark";
        themeButton.setAttribute("aria-pressed", String(dark));
        themeButton.textContent = dark ? "☀ Chế độ sáng" : "☾ Chế độ đêm";
      }
      themeButton.onclick = () => {
        const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem("harumii-preview-theme", theme); } catch {}
        showThemeButton();
      };
      showThemeButton();
      let remembered = null;
      $("#folder").onclick = async () => {
        try {
          if (!window.showDirectoryPicker) {
            $("#openFiles").click();
            return;
          }
          const handle = await showDirectoryPicker({
            mode: "read",
            id: "harumii-kaiwa",
          });
          remembered = handle;
          try {
            await storedHandle(handle);
          } catch (e) {
            message(
              "Trình duyệt chưa lưu được thư mục; vẫn có thể đọc lần này.",
            );
          }
          state.source = await folderSource(handle);
          await reload();
        } catch (e) {
          if (e.name !== "AbortError")
            message("Không mở được thư mục: " + e.message);
        }
      };
      $("#openFiles").onchange = async (e) => {
        state.source = filesSource(e.target.files);
        await reload();
        $("#connection").textContent +=
          " · Chọn lại thư mục để đọc các file được sửa hoặc thêm mới.";
      };
      $("#refresh").onclick = async () => {
        try {
          if (remembered) {
            const permission = await remembered.requestPermission({
              mode: "read",
            });
            if (permission !== "granted") {
              message("Cần quyền đọc thư mục để cập nhật dữ liệu.");
              return;
            }
            state.source = await folderSource(remembered);
          }
          await reload();
        } catch (e) {
          message("Không tải lại được: " + e.message);
        }
      };
      window.addEventListener("hashchange", () => {
        readHash();
        render();
      });
      async function start() {
        readHash();
        render();
        if (location.protocol === "http:" || location.protocol === "https:") {
          state.source = httpSource();
          await reload();
          return;
        }
        try {
          remembered = await storedHandle();
          if (
            remembered &&
            (await remembered.queryPermission({ mode: "read" })) === "granted"
          ) {
            state.source = await folderSource(remembered);
            await reload();
            return;
          }
          if (remembered) {
            message("Bấm Tải lại và cho phép đọc thư mục đã ghi nhớ.");
            return;
          }
        } catch (e) {
          /* Folder selection remains available when browser storage is disabled. */
        }
        message("Chọn thư mục dữ liệu để mở lộ trình.");
      }
      start();
    </script>
