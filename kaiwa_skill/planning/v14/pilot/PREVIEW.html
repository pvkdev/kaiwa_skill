<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f2">
<title>Harumii · Lộ trình Kaiwa</title>
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem("kaiwa-review:theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.vi = JSON.parse(localStorage.getItem("kaiwa-review:vi") ?? "true") === false ? "off" : "on";
  const scale = Number(JSON.parse(localStorage.getItem("kaiwa-review:jaScale") ?? "1"));
  if (scale >= .85 && scale <= 1.5) document.documentElement.style.setProperty("--ja-scale", scale);
} catch {
  document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.vi = "on";
}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f3f6f1;
  --surface: #ffffff;
  --soft: #edf2ec;
  --text: #1d322b;
  --muted: #667870;
  --line: #dfe7de;
  --accent: #2e7057;
  --accent-strong: #235a46;
  --accent-soft: #e5f1e9;
  --male: #2f74d0;
  --male-soft: #e9f1fc;
  --male-line: #bfd6f4;
  --female: #d04a78;
  --female-soft: #fdecf2;
  --female-line: #f5c5d6;
  --n0: #4c8a77;
  --n0-soft: #e8f3ee;
  --n0-line: #c3ddd2;
  --n1: #6f78bd;
  --n1-soft: #eceefa;
  --n1-line: #cdd2ee;
  --shadow: 0 16px 50px #1c392618;
  --shadow-sm: 0 1px 2px #1c39260d, 0 4px 14px #1c39260a;
  --sidebar: 320px;
  --outline: 300px;
  --header: 68px;
  --chrome: var(--header);
  --toolbar: 62px;
  --ja-scale: 1;
  --ja-font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  font-family: Inter, "Segoe UI", system-ui, -apple-system, "Noto Sans", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1a17;
  --surface: #162520;
  --soft: #1d2f28;
  --text: #e6eee8;
  --muted: #9fb2a7;
  --line: #2a3e33;
  --accent: #9ed8b6;
  --accent-strong: #b8e8cc;
  --accent-soft: #223e2f;
  --male: #86b6f4;
  --male-soft: #1a2b45;
  --male-line: #2e4a73;
  --female: #f293b5;
  --female-soft: #3a1f2b;
  --female-line: #6a3a4d;
  --n0: #8ccbb4;
  --n0-soft: #1b3129;
  --n0-line: #2f5043;
  --n1: #a3abe6;
  --n1-soft: #22254a;
  --n1-line: #3a3f78;
  --shadow: 0 16px 50px #0006;
  --shadow-sm: 0 1px 2px #0004, 0 4px 14px #0003;
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; }
button, a, summary { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; color: inherit; border: 0; }
button:disabled { cursor: default; opacity: .35; }
a { color: var(--accent); text-underline-offset: 4px; }
button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 3px;
}
[hidden] { display: none !important; }
[lang="ja"], .ja { font-family: var(--ja-font); }
.skip { position: fixed; top: -100px; left: 16px; z-index: 100; padding: 12px; background: var(--surface); }
.skip:focus { top: 12px; }

/* ───── Top bar ───── */
.topbar {
  position: fixed; inset: 0 0 auto; height: var(--header); z-index: 30;
  display: flex; align-items: center; gap: 24px; padding: 0 24px 0 20px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  transition: transform .22s ease;
}
.brand { display: flex; align-items: center; gap: 12px; width: calc(var(--sidebar) - 20px); flex-shrink: 0; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #6bc3a0));
  color: var(--surface); font: 700 21px serif;
}
.brand strong { font-size: 19px; letter-spacing: -.5px; }
.brand small { display: block; color: var(--muted); font-size: 10.5px; letter-spacing: 1.5px; margin-top: 2px; }
.level-tabs { display: flex; padding: 4px; background: var(--soft); border-radius: 13px; gap: 3px; }
.level-tab { min-width: 96px; padding: 9px 16px; background: transparent; color: var(--muted); border-radius: 10px; font-weight: 650; }
.level-tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }
.level-tab span { margin-left: 7px; font-size: 11px; opacity: .65; }
.header-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.version { color: var(--muted); font-size: 12px; white-space: nowrap; }
.theme-button, .nav-trigger, .drawer-close {
  background: transparent; display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; min-height: 44px; padding: 9px 12px; border-radius: 10px;
}
.theme-button:hover, .nav-trigger:hover, .drawer-close:hover { background: var(--soft); }
.theme-glyph { font-size: 21px; line-height: 1; }
.nav-trigger, .drawer-close { display: none; }

/* ───── Left sidebar ───── */
.sidebar {
  position: fixed; left: 0; top: var(--header); bottom: 0; width: var(--sidebar); z-index: 25;
  display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line);
}
.sidebar-head { padding: 22px 20px 14px; }
.sidebar-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sidebar-title h2 { margin: 0; font-size: 15px; font-weight: 700; }
.sidebar-title .count { color: var(--muted); font-size: 12px; }
.search-wrap { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 0 12px; gap: 9px; }
.search-wrap span { color: var(--muted); font-size: 20px; }
#search { background: transparent; border: 0; padding: 12px 0; width: 100%; min-width: 0; color: var(--text); font-size: 13px; }
#search::placeholder { color: var(--muted); opacity: .85; }
#search:focus { outline: none; }
.search-wrap:focus-within { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
.stage-list { padding: 0 12px 32px; overflow-y: auto; overscroll-behavior: contain; flex: 1; scrollbar-width: thin; }
.nav-group { margin-top: 16px; }
.nav-group > summary { list-style: none; cursor: pointer; padding: 11px 12px; color: var(--text); background: var(--soft); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; margin-bottom: 6px; font-size: 12.5px; line-height: 1.55; font-weight: 750; display: flex; gap: 10px; align-items: center; }
.nav-group > summary::before { content: "⌄"; font-size: 14px; }
.nav-group:not([open]) > summary::before { content: "›"; }
.nav-group > summary::-webkit-details-marker { display: none; }
.stage-button { display: flex; align-items: baseline; gap: 12px; text-align: left; width: 100%; padding: 11px 10px; border-radius: 10px; background: transparent; font-size: 13px; line-height: 1.5; margin: 2px 0; }
.stage-button:hover { background: var(--soft); }
.stage-button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.stage-number { font-size: 11px; color: var(--muted); min-width: 23px; font-variant-numeric: tabular-nums; }
.specialty-marker { color: var(--accent); font-size: 18px; line-height: 1; }
.stage-button[aria-current="page"] .stage-number { color: var(--accent); }
.no-results { color: var(--muted); padding: 25px 12px; font-size: 13px; }
.sidebar-foot { padding: 13px 20px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

/* ───── Right outline ───── */
.outline {
  position: fixed; right: 0; top: var(--header); bottom: 0; width: var(--outline); z-index: 25;
  display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line);
}
.outline-head { padding: 20px 18px 12px; border-bottom: 1px solid var(--line); }
.outline-top { display: flex; align-items: center; gap: 8px; }
.outline-top h2 { margin: 0; font-size: 11px; font-weight: 750; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
.outline-top .drawer-close { margin-left: auto; min-height: 36px; padding: 4px 10px; font-size: 22px; }
.outline-stage { margin: 8px 0 11px; font-size: 14px; line-height: 1.5; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.outline-actions { display: flex; gap: 4px; }
.outline-actions .text-button { padding: 5px 9px; border-radius: 8px; background: var(--soft); font-size: 11.5px; color: var(--text); }
.outline-actions .text-button:hover { background: var(--accent-soft); color: var(--accent); }
.outline-tree { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 10px 10px 40px; scrollbar-width: thin; position: relative; }
.ol-group { margin: 2px 0; }
.ol-row { display: flex; align-items: flex-start; gap: 2px; }
.ol-toggle { width: 24px; height: 30px; flex-shrink: 0; background: transparent; color: var(--muted); font-size: 12px; border-radius: 6px; display: grid; place-items: center; }
.ol-toggle:hover { background: var(--soft); }
.ol-toggle::before { content: "▾"; transition: transform .15s; }
.ol-group.collapsed > .ol-row > .ol-toggle::before { transform: rotate(-90deg); }
.ol-spacer { width: 24px; flex-shrink: 0; }
.ol-link {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 9px;
  background: transparent; text-align: left; font-size: 12.5px; line-height: 1.45; color: var(--text);
}
.ol-link:hover { background: var(--soft); }
.ol-link[aria-current="location"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 650; box-shadow: inset 3px 0 0 var(--accent); }
.ol-link .ol-text { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.ol-link .ol-count { flex-shrink: 0; font-size: 10.5px; color: var(--muted); background: var(--soft); padding: 1px 7px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.ol-link .icon { width: 22px; height: 22px; border-radius: 7px; font-size: 12px; }
.ol-children { margin-left: 12px; padding-left: 10px; border-left: 1px dashed var(--line); }
.ol-group.collapsed > .ol-children { display: none; }
.ol-link.lv2 { font-size: 12px; padding: 6px 8px; }
.ol-no { flex-shrink: 0; min-width: 22px; text-align: center; font-size: 10.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.ol-link[aria-current="location"] .ol-no { color: var(--accent); }
.ol-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); margin: 0 8px; flex-shrink: 0; }
.ol-soon { font-size: 10px; color: var(--muted); font-style: italic; }
.ol-gender { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--g, var(--line)); }
.fab-outline {
  display: none; position: fixed; right: 14px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 26;
  padding: 12px 16px; border-radius: 99px; background: var(--accent); color: var(--surface);
  font-size: 13px; font-weight: 700; box-shadow: var(--shadow); gap: 8px; align-items: center;
}
.fab-outline .fab-glyph { font-size: 16px; line-height: 1; }

/* ───── Main ───── */
main { margin-left: var(--sidebar); margin-right: var(--outline); margin-top: var(--header); min-height: calc(100vh - var(--header)); padding: 34px clamp(20px, 3.2vw, 52px) 120px; }
.reader { max-width: 860px; margin: 0 auto; }
.breadcrumb { color: var(--muted); font-size: 12px; line-height: 1.8; margin: 0 0 14px; }
.breadcrumb span { margin: 0 7px; opacity: .5; }
.pilot-box { margin-bottom: 14px; font-size: 12px; color: var(--muted); }
.pilot-box > summary { cursor: pointer; width: max-content; padding: 4px 0; }
.pilot-box div { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pilot-box a { padding: 5px 10px; background: var(--soft); border-radius: 8px; text-decoration: none; font-size: 12px; }

.stage-hero {
  position: relative; overflow: hidden; padding: 28px 30px 24px; margin-bottom: 20px; border-radius: 22px;
  border: 1px solid var(--line);
  background:
    radial-gradient(circle at 100% 0, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%),
    linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--accent-soft) 40%, var(--surface)));
  box-shadow: var(--shadow-sm);
}
.stage-hero::after {
  content: "話"; position: absolute; right: 18px; bottom: -34px; font: 700 150px/1 serif; color: var(--accent); opacity: .06; pointer-events: none;
}
.stage-kicker { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); background: var(--accent-soft); font-size: 11px; text-transform: uppercase; font-weight: 750; letter-spacing: 1.4px; margin: 0 0 14px; padding: 5px 11px; border-radius: 99px; }
h1 { margin: 0; max-width: 780px; font-size: clamp(25px, 2.6vw, 36px); font-weight: 750; line-height: 1.32; letter-spacing: -.9px; text-wrap: balance; }
.objective { max-width: 680px; color: var(--muted); font-size: 15.5px; line-height: 1.8; margin: 14px 0 20px; }
.stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.stat { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 12px; border-radius: 11px; background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.stat b { font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
.stage-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; font-size: 12px; color: var(--muted); }
.accent-button { background: var(--accent); color: var(--surface); border-radius: 11px; padding: 11px 18px; font-weight: 650; font-size: 13px; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 28%, transparent); }
.accent-button:hover { filter: brightness(1.08); }

.toolbar {
  position: sticky; top: var(--chrome); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding: 11px 0; margin-bottom: 22px; min-height: var(--toolbar);
  transition: top .22s ease;
}
.toolbar h2 { margin: 0; font-size: 14px; font-weight: 700; }
.toolbar small { color: var(--muted); font-size: 11px; display: block; margin-top: 3px; }
.tool-group { display: flex; align-items: center; gap: 8px; }
.tool-btn { display: inline-flex; gap: 7px; align-items: center; background: var(--surface); border: 1px solid var(--line); padding: 9px 12px; border-radius: 10px; white-space: nowrap; font-size: 12px; font-weight: 650; min-height: 38px; }
.tool-btn:hover { border-color: var(--accent); }
.tool-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.tool-btn .tool-glyph { font-size: 14px; line-height: 1; }
.size-group { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.size-group button { background: transparent; min-width: 38px; min-height: 36px; font-weight: 700; font-size: 12px; }
.size-group button + button { border-left: 1px solid var(--line); }
.size-group button:hover { background: var(--soft); }
.size-group button:nth-child(2) { font-size: 15px; }
.filter-anchor { position: relative; }
.filter-panel { position: absolute; top: calc(100% + 9px); right: 0; width: 320px; padding: 16px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); box-shadow: var(--shadow); z-index: 40; }
.filter-panel-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
.text-button { background: transparent; color: var(--accent); font-size: 12px; padding: 7px; }
.filter-row { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 12px; }
.filter-row input { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; }
.filter-row .filter-count { margin-left: auto; font-size: 11px; color: var(--muted); }

/* ───── Lesson cards ───── */
.icon { display: inline-grid; place-items: center; flex-shrink: 0; width: 40px; height: 40px; border-radius: 13px; font-weight: 700; font-size: 19px; color: var(--kind); background: var(--soft); background: color-mix(in srgb, var(--kind) 12%, var(--surface)); }
.icon.small { width: 26px; height: 26px; border-radius: 8px; font-size: 14px; }
.kind-vocabulary { --kind: #328575; }
.kind-speak_video { --kind: #8a65b7; }
.kind-speak_shadow { --kind: #6882c8; }
.kind-shadowing { --kind: #c28a2a; }
.kind-reading { --kind: #5b8d4c; }
.kind-lecture { --kind: #507ea0; }
.kind-situations { --kind: #c0705c; }
.kind-challenge { --kind: #b67a9d; }
.kind-free { --kind: #668b81; }
:root[data-theme="dark"] .icon { color: color-mix(in srgb, var(--kind) 60%, #fff); }
.lesson { margin: 0 0 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-sm); position: relative; overflow: clip; }
.lesson::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--kind); opacity: .75; }
.lesson > summary { list-style: none; display: flex; align-items: center; gap: 14px; padding: 18px 20px 18px 24px; cursor: pointer; }
.lesson > summary::-webkit-details-marker { display: none; }
.lesson > summary::after { content: "⌄"; margin-left: 4px; flex-shrink: 0; color: var(--muted); font-size: 18px; transition: transform .2s; }
.lesson[open] > summary::after { transform: rotate(180deg); }
.lesson[open] { border-color: color-mix(in srgb, var(--kind) 38%, var(--line)); }
.lesson[open] > summary { border-bottom: 1px solid var(--line); }
.lesson-label { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; letter-spacing: .3px; }
.lesson-heading { min-width: 0; flex: 1; }
.lesson-count { flex-shrink: 0; font-size: 11px; font-weight: 650; color: var(--kind); background: color-mix(in srgb, var(--kind) 11%, var(--surface)); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
:root[data-theme="dark"] .lesson-count { color: color-mix(in srgb, var(--kind) 60%, #fff); }
.specialty-caption { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 5px 12px; margin-bottom: 6px; }
.specialty-caption .lesson-label { margin: 0; }
.specialty-badge { --badge: var(--accent); display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 7px; font-size: 11px; font-weight: 650; line-height: 1.5; color: color-mix(in srgb, var(--badge) 80%, var(--text)); background: color-mix(in srgb, var(--badge) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--badge) 25%, var(--line)); }
.specialty-patterns { --badge: #507ea0; }
.specialty-mini { --badge: #328575; }
.specialty-keigo { --badge: #8a65b7; }
.specialty-idioms { --badge: #b18131; }
.specialty-emotion { --badge: #b67a9d; }
:root[data-theme="dark"] .specialty-badge { color: color-mix(in srgb, var(--badge) 55%, #fff); }
.lesson h3 { font-size: 16px; line-height: 1.55; font-weight: 650; margin: 0; overflow-wrap: anywhere; }
.lesson-body { padding: 22px 24px 26px; line-height: 1.8; background: color-mix(in srgb, var(--bg) 55%, var(--surface)); }
.lesson-body > :first-child { margin-top: 0; }
.quiet { color: var(--muted); font-size: 13px; }
.word-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: clamp(.8rem, 1.5vw, .94rem); }
.word-table + .word-table { margin-top: 1.4rem; }
.word-table caption { text-align: start; padding-bottom: .45rem; font-size: .95rem; font-weight: 700; line-height: 1.45; }
.word-table th, .word-table td { padding: .45em .55em; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; overflow-wrap: anywhere; }
.word-table thead th { background: var(--soft); color: var(--muted); }
.word-table thead .vi { width: 34%; }
.word-table .han-viet { font-size: .82em; color: var(--muted); }
.word-table tbody th { font-size: calc(1.05em * var(--ja-scale)); }
.word-table .word-reading { color: var(--muted); font-size: calc(.95em * var(--ja-scale)); }
.vocabulary-groups { display: flex; flex-wrap: wrap; gap: 9px; padding: 0; margin: 0 0 12px; list-style: none; }
.vocabulary-groups li { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 9px 14px; font-size: 14px; }
.placeholder { display: flex; align-items: center; justify-content: center; text-align: left; gap: 14px; padding: 24px 18px; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 13px; }
.placeholder .placeholder-icon { font-size: 24px; color: var(--kind); opacity: .7; }

/* ───── Characters: avatar, gender mark, role tag ───── */
.g-male { --g: var(--male); --g-soft: var(--male-soft); --g-line: var(--male-line); }
.g-female { --g: var(--female); --g-soft: var(--female-soft); --g-line: var(--female-line); }
.g-n0 { --g: var(--n0); --g-soft: var(--n0-soft); --g-line: var(--n0-line); }
.g-n1 { --g: var(--n1); --g-soft: var(--n1-soft); --g-line: var(--n1-line); }
.avatar { position: relative; flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; background: var(--g-soft); border: 2px solid var(--g-line); color: var(--g); display: grid; place-items: center; }
.avatar svg { width: 30px; height: 30px; fill: currentColor; overflow: visible; }
.avatar.mini { width: 26px; height: 26px; border-width: 1.5px; }
.avatar.mini svg { width: 19px; height: 19px; }
.gbadge { position: absolute; right: -5px; bottom: -4px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; background: var(--g); color: #fff; font: 700 12px/1 system-ui, sans-serif; border: 2px solid var(--surface); font-variant-emoji: text; }
:root[data-theme="dark"] .gbadge { color: #0f1a17; }
.avatar.mini .gbadge { width: 13px; height: 13px; font-size: 8px; right: -4px; bottom: -3px; border-width: 1.5px; }
.role-tag {
  position: absolute; top: -10px; max-width: min(300px, 78vw); padding: 1px 9px; border-radius: 99px;
  font-size: 10.5px; line-height: 1.7; font-weight: 700; letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: color-mix(in srgb, var(--g) 82%, var(--text)); background: var(--surface); border: 1px solid var(--g-line);
  box-shadow: 0 1px 2px #0000000a;
}
.role-tag i { font-style: normal; opacity: .85; font-weight: 600; margin-left: 2px; }
.cast { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 16px; }
.cast-item { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 4px; border-radius: 99px; background: var(--g-soft); border: 1px solid var(--g-line); font-size: 12px; line-height: 1.4; }
.cast-item b { font-weight: 700; color: color-mix(in srgb, var(--g) 75%, var(--text)); }
.cast-item small { color: var(--muted); font-size: 11px; }
.cast-arrow { color: var(--muted); font-size: 14px; }

/* ───── Chat bubbles ───── */
.chat { display: flex; flex-direction: column; gap: 20px; padding: 8px 0 2px; }
.msg { display: flex; align-items: flex-start; gap: 10px; }
.msg.right { flex-direction: row-reverse; }
.msg .avatar { margin-top: 8px; }
.bubble {
  position: relative; max-width: min(80%, 660px); min-width: 140px; margin-top: 8px; padding: 15px 17px 12px;
  border-radius: 6px 20px 20px 20px; background: var(--g-soft); border: 1px solid var(--g-line);
  box-shadow: var(--shadow-sm);
}
.msg.right .bubble { border-radius: 20px 6px 20px 20px; }
.bubble .role-tag { left: 14px; }
.msg.right .bubble .role-tag { left: auto; right: 14px; }
.msg.right .bubble { text-align: left; }
.bubble .ja, .sentence .ja { margin: 0; font-size: calc(17px * var(--ja-scale)); line-height: 1.75; font-weight: 500; letter-spacing: .02em; overflow-wrap: anywhere; }
.bubble .vi, .sentence .vi { margin: 7px 0 0; padding-top: 7px; border-top: 1px dashed color-mix(in srgb, var(--g) 28%, transparent); font-size: 13.5px; line-height: 1.6; color: color-mix(in srgb, var(--muted) 88%, var(--text)); overflow-wrap: anywhere; }
html[data-vi="off"] .vi { display: none; }
html[data-vi="off"] .reveal .vi { display: block; }
html[data-vi="off"] .bubble, html[data-vi="off"] .sentence { cursor: pointer; }
html[data-vi="off"] .bubble:not(.reveal)::after, html[data-vi="off"] .sentence:not(.reveal)::after {
  content: "chạm để xem nghĩa"; display: block; margin-top: 4px; font-size: 10.5px; color: var(--muted); opacity: .75; font-style: italic;
}
.chat-note { text-align: center; font-size: 11.5px; color: var(--muted); }

/* ───── Single sentences ───── */
.sentence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px 14px; margin: 4px 0; }
.sentence {
  --g: var(--n0); --g-soft: var(--n0-soft); --g-line: var(--n0-line);
  position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 18px 16px 14px; border-radius: 16px; background: var(--surface);
  border: 1px solid var(--line); box-shadow: var(--shadow-sm);
}
.sentence.g-male { --g: var(--male); --g-soft: var(--male-soft); --g-line: var(--male-line); }
.sentence.g-female { --g: var(--female); --g-soft: var(--female-soft); --g-line: var(--female-line); }
.sentence .avatar { margin-top: 4px; }
.sentence-text { min-width: 0; flex: 1; }
.sentence .role-tag { position: static; display: inline-block; margin: 0 0 5px; max-width: 100%; background: var(--g-soft); }
.sentence::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--g); opacity: .6; }
.idx-chip { position: absolute; top: -9px; right: 12px; padding: 0 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 10.5px; font-weight: 700; line-height: 1.8; font-variant-numeric: tabular-nums; }
.idx-chip.left { right: auto; left: 14px; }

/* ───── Dialogue / scene cards ───── */
.card { position: relative; padding: 22px 20px 18px; margin: 18px 0; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.card-kind { position: absolute; top: -10px; left: 16px; padding: 0 10px; border-radius: 99px; font-size: 10.5px; font-weight: 700; line-height: 1.8; background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); }
.card .idx-chip { top: -10px; right: 16px; }
.shadow-intro { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.7; }

.event { margin: 0 0 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: clip; box-shadow: var(--shadow-sm); }
.event > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
.event > summary::-webkit-details-marker { display: none; }
.event > summary::after { content: "⌄"; margin-left: auto; color: var(--muted); font-size: 17px; transition: transform .2s; }
.event[open] > summary::after { transform: rotate(180deg); }
.event[open] > summary { border-bottom: 1px solid var(--line); }
.event-no { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--surface); font-weight: 700; font-size: 13px; flex-shrink: 0; }
.event-name { font-weight: 700; font-size: 14.5px; line-height: 1.45; }
.event-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; color: var(--muted); font-size: 11.5px; }
.role-chip { padding: 1px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 11px; }
.event-count { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
.event > summary + * { margin-top: 0; }
.event-body { padding: 8px 14px 6px; display: grid; gap: 12px; }
.scene { position: relative; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); }
.scene > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 11px; padding: 12px 14px; }
.scene > summary::-webkit-details-marker { display: none; }
.scene > summary::after { content: "⌄"; margin-left: auto; color: var(--muted); font-size: 16px; transition: transform .2s; flex-shrink: 0; }
.scene[open] > summary::after { transform: rotate(180deg); }
.scene-no { flex-shrink: 0; min-width: 32px; height: 26px; padding: 0 8px; border-radius: 9px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.scene-title { font-size: 14px; font-weight: 650; line-height: 1.5; min-width: 0; }
.scene-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.branch, .link-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 99px; font-size: 10.5px; font-weight: 700; line-height: 1.7; color: color-mix(in srgb, var(--b, var(--muted)) 85%, var(--text)); background: color-mix(in srgb, var(--b, var(--muted)) 11%, var(--surface)); border: 1px solid color-mix(in srgb, var(--b, var(--muted)) 24%, var(--line)); }
.branch-routine, .branch-accepted, .branch-resolved { --b: #3b8a63; }
.branch-misunderstanding, .branch-problem { --b: #d0742f; }
.branch-conditional { --b: #3f7ac0; }
.branch-follow_up { --b: #2f8f8f; }
.branch-declined, .branch-unresolved { --b: #c24f5c; }
.branch-alternative { --b: #8a65b7; }
.branch-pending { --b: #b08a2b; }
.link-chip { --b: var(--muted); background: transparent; cursor: pointer; }
.link-chip:hover { border-color: var(--accent); color: var(--accent); }
.scene-body { padding: 4px 16px 16px; }
.scene-context { margin: 0 0 14px; padding: 10px 13px; border-radius: 12px; background: var(--surface); border-left: 3px solid var(--accent); font-size: 13px; line-height: 1.7; color: var(--muted); }
.scene-context b { color: var(--accent); font-size: 11px; letter-spacing: .6px; text-transform: uppercase; margin-right: 6px; }

/* ───── Reading (Speak Japanese knowledge) ───── */
.reading { font-size: 15px; line-height: 1.85; overflow-wrap: anywhere; }
.phrase { padding: 18px 20px; margin: 0 0 16px; border-radius: 16px; background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--accent-soft) 30%, var(--surface))); border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--line)); }
.phrase .ja { margin: 0; font-size: calc(24px * var(--ja-scale)); line-height: 1.5; font-weight: 700; letter-spacing: .01em; }
.phrase .gloss { margin: 5px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
.note { margin: 10px 0; padding: 11px 15px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; line-height: 1.8; }
.note strong { color: var(--accent); font-weight: 700; }
.note.li { padding-left: 34px; position: relative; }
.note.li::before { content: ""; position: absolute; left: 16px; top: 20px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .6; }
.sec-label { display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; font-size: 12px; font-weight: 750; letter-spacing: 1.2px; color: var(--accent); text-transform: uppercase; }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sub-label { margin: 18px 0 6px; font-size: 13.5px; font-weight: 650; color: var(--text); }
.sub-label .vi-part { color: var(--muted); font-weight: 500; }
.example { position: relative; margin: 18px 0; padding: 20px 16px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.example .idx-chip { top: -10px; left: 14px; right: auto; background: var(--accent); color: var(--surface); border-color: var(--accent); }
.example-caption { margin: 0 0 6px; font-size: 13px; font-weight: 650; line-height: 1.6; padding-left: 4px; }
.example-caption .vi-part { color: var(--muted); font-weight: 500; }
.example .chat { padding-top: 4px; }
.example .sentence { box-shadow: none; border: 0; padding: 4px 6px 4px 12px; background: transparent; }
.example .sentence::before { top: 6px; bottom: 6px; }
.example .cast { margin-bottom: 10px; }
.fallback-html { font-size: 15px; line-height: 1.85; }

.provenance { border-top: 1px solid var(--line); margin-top: 26px; padding-top: 14px; color: var(--muted); font-size: 12px; }
.provenance > summary { cursor: pointer; font-weight: 650; }
.provenance p { margin: 11px 0; overflow-wrap: anywhere; }
.provenance code { font-size: 10px; display: block; white-space: normal; overflow-wrap: anywhere; }
.provenance .quality { border-left: 3px solid #bd8b43; padding-left: 12px; }
.extra-practice { margin-top: 30px; padding-top: 6px; }
.extra-practice > h4 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; font-weight: 750; letter-spacing: .6px; color: var(--text); }
.extra-practice > h4 small { font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--soft); padding: 2px 9px; border-radius: 99px; letter-spacing: 0; }
.practice-context { margin: 0 0 12px; padding: 9px 13px; border-radius: 12px; background: var(--bg); border-left: 3px solid var(--accent); font-size: 13px; line-height: 1.7; color: var(--muted); }
.practice-context b { color: var(--accent); font-size: 11px; letter-spacing: .6px; text-transform: uppercase; margin-right: 6px; }

.stage-nav { position: fixed; bottom: 0; left: var(--sidebar); right: var(--outline); z-index: 18; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 11px 24px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
.stage-nav button { background: var(--soft); border-radius: 10px; padding: 11px 17px; font-size: 12px; font-weight: 650; }
.stage-nav button:last-child { background: var(--accent); color: var(--surface); }
.stage-position { color: var(--muted); font-size: 11px; }
.empty-state { padding: 35px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); line-height: 1.8; }
.overlay { display: none; }

/* ───── Responsive ───── */
@media (min-width: 1700px) {
  :root { --sidebar: 340px; --outline: 330px; }
  .reader { max-width: 920px; }
}
@media (max-width: 1279px) {
  main { margin-right: 0; }
  .stage-nav { right: 0; }
  .outline { z-index: 50; top: 0; width: min(90vw, 360px); transform: translateX(103%); transition: transform .22s ease; box-shadow: var(--shadow); }
  body.outline-open .outline { transform: translateX(0); }
  body.outline-open .overlay { display: block; position: fixed; inset: 0; z-index: 45; background: #07100bb0; backdrop-filter: blur(2px); }
  .outline-top .drawer-close { display: inline-flex; }
  .fab-outline { display: inline-flex; }
}
@media (max-width: 1100px) {
  :root { --sidebar: 288px; }
  .topbar { gap: 14px; padding-right: 16px; }
  .level-tab { min-width: 76px; padding: 9px 12px; }
  .theme-caption { display: none; }
}
@media (max-width: 850px) {
  :root { --header: 108px; --sidebar: 320px; --toolbar: 56px; }
  body.chrome-hidden { --chrome: 0px; }
  body.chrome-hidden .topbar { transform: translateY(-100%); }
  .topbar { height: var(--header); padding: 0 14px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: 56px 52px; gap: 0; }
  .brand { width: auto; gap: 10px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; font-size: 20px; }
  .brand strong { font-size: 18px; }
  .brand small { font-size: 9px; margin-top: 1px; }
  .header-tools { grid-column: 2; grid-row: 1; gap: 2px; }
  .level-tabs { grid-column: 1 / -1; grid-row: 2; margin-bottom: 8px; padding: 3px; }
  .level-tab { flex: 1; min-width: 0; padding: 7px; font-size: 13px; }
  .version { font-size: 10px; }
  .nav-trigger { display: inline-flex; font-size: 18px; padding: 8px 10px; }
  .theme-button { padding: 8px 10px; }
  .sidebar { z-index: 50; top: 0; width: min(88vw, 365px); transform: translateX(-103%); transition: transform .2s ease; box-shadow: var(--shadow); }
  body.drawer-open .sidebar { transform: translateX(0); }
  body.drawer-open .overlay { display: block; position: fixed; inset: 0; z-index: 45; background: #07100bb0; backdrop-filter: blur(2px); }
  .sidebar .drawer-close { display: inline-flex; font-size: 23px; margin-left: auto; }
  .sidebar-head { padding-top: 17px; }
  .sidebar-title { margin-bottom: 8px; }
  .sidebar-title .count { margin-left: 10px; }
  main { margin-left: 0; padding: 18px 10px 110px; }
  .breadcrumb { margin-bottom: 12px; font-size: 11px; }
  .stage-hero { padding: 20px 16px 16px; border-radius: 18px; margin-bottom: 14px; }
  .stage-hero::after { font-size: 110px; right: 6px; bottom: -26px; }
  h1 { font-size: 23px; letter-spacing: -.5px; }
  .objective { font-size: 13.5px; line-height: 1.75; margin: 10px 0 14px; }
  .stat { padding: 6px 10px; font-size: 11px; }
  .stat b { font-size: 14px; }
  .stage-meta { gap: 12px; font-size: 11px; }
  .accent-button { padding: 10px 14px; font-size: 12px; }
  .toolbar { padding: 8px 0; margin-bottom: 16px; gap: 8px; }
  .toolbar h2 { font-size: 13px; }
  .toolbar small { font-size: 10px; }
  .tool-btn { padding: 8px 10px; min-height: 36px; }
  .tool-btn .tool-text { display: none; }
  .tool-btn.keep-text .tool-text { display: inline; }
  .size-group button { min-width: 34px; min-height: 34px; }
  .filter-panel { position: fixed; left: 10px; right: 10px; top: auto; bottom: calc(76px + env(safe-area-inset-bottom)); width: auto; }
  .lesson { border-radius: 15px; margin-bottom: 11px; }
  .lesson > summary { padding: 13px 12px 13px 16px; gap: 10px; }
  .lesson h3 { font-size: 14px; }
  .lesson-count { display: none; }
  .icon { width: 34px; height: 34px; border-radius: 11px; font-size: 17px; }
  .lesson-body { padding: 16px 10px 20px; }
  .vocabulary-groups li { font-size: 13px; padding: 8px 11px; }
  .event { border-radius: 15px; }
  .event > summary { padding: 11px 12px; }
  .event-body { padding: 8px 8px 4px; gap: 10px; }
  .event-count { display: none; }
  .scene > summary { padding: 11px 10px; gap: 9px; }
  .scene-body { padding: 2px 8px 12px; }
  .scene-title { font-size: 13.5px; }
  .chat { gap: 18px; }
  .msg { gap: 7px; }
  .avatar { width: 34px; height: 34px; }
  .avatar svg { width: 24px; height: 24px; }
  .gbadge { width: 16px; height: 16px; font-size: 10px; right: -4px; bottom: -3px; }
  .bubble { max-width: calc(100% - 44px); min-width: 96px; padding: 14px 13px 10px; border-radius: 5px 17px 17px 17px; }
  .msg.right .bubble { border-radius: 17px 5px 17px 17px; }
  .bubble .ja, .sentence .ja { font-size: calc(16px * var(--ja-scale)); line-height: 1.7; }
  .bubble .vi, .sentence .vi { font-size: 13px; }
  .sentence-grid { grid-template-columns: 1fr; gap: 16px; }
  .card { padding: 20px 10px 14px; border-radius: 15px; }
  .cast { gap: 6px; margin-bottom: 12px; }
  .cast-item { font-size: 11.5px; padding-right: 10px; }
  .cast-item .full { display: none; }
  .event-body { padding: 6px 0 2px; }
  .scene-body { padding: 2px 6px 10px; }
  .fab-outline { padding: 10px 14px; font-size: 12.5px; }
  .example { padding: 18px 8px 10px; }
  .phrase { padding: 14px 15px; }
  .phrase .ja { font-size: calc(21px * var(--ja-scale)); }
  .note { font-size: 13.5px; padding: 10px 12px; }
  .stage-nav { left: 0; padding: 9px 14px calc(9px + env(safe-area-inset-bottom)); }
  .stage-nav button { font-size: 12px; padding: 10px 13px; }
  .stage-position { font-size: 10px; }
}
@media (max-width: 420px) {
  .msg { gap: 6px; }
  .avatar:not(.mini) { width: 30px; height: 30px; margin-top: 12px; }
  .avatar:not(.mini) svg { width: 21px; height: 21px; }
  .avatar:not(.mini) .gbadge { width: 15px; height: 15px; font-size: 9px; }
  .bubble { max-width: calc(100% - 38px); min-width: 120px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
.lecture-text { max-width: 72ch; line-height: 1.75; }
.lecture-text h4, .lecture-video summary { font-size: 1rem; font-weight: 700; }
.lecture-text h5 { margin: 1.5rem 0 .45rem; font-size: 1.08rem; color: var(--accent); }
.lecture-text p { margin: .55rem 0; }
.lecture-text ul { padding-inline-start: 1.2rem; }
.lecture-example { margin: .8rem 0; padding: .45rem .9rem; border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 8px 8px 0; }
.lecture-example .ja { font-size: calc(1.04rem * var(--ja-scale)); }
.lecture-video { margin-top: 1.5rem; padding: .8rem 0; border-top: 1px solid var(--line); }
.lecture-video summary { cursor: pointer; }
</style>
</head>
<body>
<a class="skip" href="#main">Đến nội dung</a>
<header class="topbar" id="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">話</span><div><strong>Harumii</strong><small>KAIWA ROADMAP</small></div></div>
  <div class="level-tabs" role="tablist" aria-label="Cấp độ"></div>
  <div class="header-tools">
    <span class="version" id="version"></span>
    <button type="button" class="theme-button" id="theme"><span class="theme-glyph" aria-hidden="true"></span><span class="theme-caption"></span></button>
    <button type="button" class="nav-trigger" id="open-nav" aria-label="Chọn chặng" aria-expanded="false" aria-controls="sidebar">☰</button>
  </div>
</header>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar" aria-label="Danh sách chặng">

<script id="course-data" type="application/json">{"version":"14.0-pilot","stages":[{"uid":"da5c16e5-9425-5a4f-9086-8c109aa79c90","code":"S-011","level":"Sơ","number":14,"title":"Tàu điện & xe buýt","cluster":"Tự đi lại trong thành phố","cluster_id":"S03","objective":"Đi tuyến tàu hoặc xe buýt cơ bản và biết hỏi khi thông tin trên biển chưa đủ.","events":[{"id":"E01","name":"Chọn tàu và chuyển tuyến","roles":["người học","nhân viên ga"]},{"id":"E02","name":"Đi xe buýt","roles":["người học","lái xe hoặc nhân viên bến"]},{"id":"E03","name":"Nhờ hỗ trợ ở ga","roles":["người học","nhân viên ga"]}],"situations":[{"id":"S001","event_id":"E01","title":"Hỏi tàu này có tới ga cần không","branch":"routine","origin":"ai_authored","uid":"519f0e38-bbc1-5164-a0a0-bd370a5e996d","level":"Sơ","dialogue":{"context_vi":"Tại sân ga, bạn muốn đến ga Sakura nhưng chưa biết tàu đang đỗ có tới đó không. Bạn hỏi nhân viên trước khi lên.","speakers":[{"id":"a","role_vi":"người học","gender":"female"},{"id":"b","role_vi":"nhân viên ga","gender":"male"}],"turns":[{"id":"519f0e38-bbc1-5164-a0a0-bd370a5e996d-u01","speaker_id":"a","ja":"すみません、この電車は桜駅に行きますか。","vi":"Xin lỗi, tàu này có đến ga Sakura không ạ?"},{"id":"519f0e38-bbc1-5164-a0a0-bd370a5e996d-u02","speaker_id":"b","ja":"いいえ、桜駅には行きません。青葉駅まで行きます。","vi":"Không, tàu này không đến ga Sakura. Tàu đi đến ga Aoba."},{"id":"519f0e38-bbc1-5164-a0a0-bd370a5e996d-u03","speaker_id":"a","ja":"桜駅へは、どの電車ですか。","vi":"Vậy tôi đi tàu nào để đến ga Sakura ạ?"},{"id":"519f0e38-bbc1-5164-a0a0-bd370a5e996d-u04","speaker_id":"b","ja":"青葉駅で乗り換えてください。まず、この電車に乗ってください。","vi":"Chị đổi tàu ở ga Aoba. Trước tiên, mời chị lên tàu này."},{"id":"519f0e38-bbc1-5164-a0a0-bd370a5e996d-u05","speaker_id":"a","ja":"この電車で青葉駅までですね。","vi":"Tàu này đến ga Aoba, đúng không ạ?"},{"id":"519f0e38-bbc1-5164-a0a0-bd370a5e996d-u06","speaker_id":"b","ja":"はい、そうです。","vi":"Vâng, đúng rồi."}]}},{"id":"S002","event_id":"E01","title":"Hỏi phải đổi ở ga nào","branch":"routine","origin":"ai_authored","uid":"ae9d1408-aae7-5398-85ba-a2c7f29a45d6","level":"Sơ","dialogue":{"context_vi":"Bạn muốn đến ga Sakura và nghe nói phải đổi tàu, nhưng chưa biết đổi ở ga nào. Bạn hỏi nhân viên trước khi đi.","speakers":[{"id":"a","role_vi":"người học","gender":"female"},{"id":"b","role_vi":"nhân viên ga","gender":"male"}],"turns":[{"id":"ae9d1408-aae7-5398-85ba-a2c7f29a45d6-u01","speaker_id":"a","ja":"すみません、桜駅へ行きたいです。どこで乗り換えますか。","vi":"Xin lỗi, tôi muốn đến ga Sakura. Tôi đổi tàu ở đâu ạ?"},{"id":"ae9d1408-aae7-5398-85ba-a2c7f29a45d6-u02","speaker_id":"b","ja":"青葉駅で乗り換えます。","vi":"Chị đổi tàu ở ga Aoba."},{"id":"ae9d1408-aae7-5398-85ba-a2c7f29a45d6-u03","speaker_id":"a","ja":"青葉駅ですか。","vi":"Ga Aoba ạ?"},{"id":"ae9d1408-aae7-5398-85ba-a2c7f29a45d6-u04","speaker_id":"b","ja":"はい。青葉駅で降りてください。","vi":"Đúng rồi. Chị xuống ở ga Aoba."},{"id":"ae9d1408-aae7-5398-85ba-a2c7f29a45d6-u05","speaker_id":"a","ja":"わかりました。青葉駅で降ります。","vi":"Tôi hiểu rồi. Tôi sẽ xuống ở ga Aoba."}]}},{"id":"S003","event_id":"E01","title":"Hỏi sân ga của tuyến tiếp theo","branch":"routine","origin":"ai_authored","uid":"c86d5282-a8f9-5db3-9a55-2ded9d0541b0","level":"Sơ","dialogue":{"context_vi":"Bạn vừa xuống ở ga Aoba để đổi tàu đi ga Sakura. Bạn hỏi nhân viên lối đến sân ga của chuyến tiếp theo.","speakers":[{"id":"a","role_vi":"người học","gender":"female"},{"id":"b","role_vi":"nhân viên ga","gender":"male"}],"turns":[{"id":"c86d5282-a8f9-5db3-9a55-2ded9d0541b0-u01","speaker_id":"a","ja":"すみません、桜駅へ行く電車はどちらですか。","vi":"Xin lỗi, tàu đi ga Sakura ở phía nào ạ?"},{"id":"c86d5282-a8f9-5db3-9a55-2ded9d0541b0-u02","speaker_id":"b","ja":"２番線です。あちらの階段を上がってください。","vi":"Ở sân ga số 2. Chị lên cầu thang phía kia."},{"id":"c86d5282-a8f9-5db3-9a55-2ded9d0541b0-u03","speaker_id":"a","ja":"２番線ですね。こちらの階段ですか。","vi":"Sân ga số 2 ạ. Cầu thang này phải không ạ?"},{"id":"c86d5282-a8f9-5db3-9a55-2ded9d0541b0-u04","speaker_id":"b","ja":"いいえ、その先の階段です。","vi":"Không, cầu thang phía trước nữa."},{"id":"c86d5282-a8f9-5db3-9a55-2ded9d0541b0-u05","speaker_id":"a","ja":"あ、あちらですね。ありがとうございます。","vi":"À, phía kia ạ. Cảm ơn anh."}]}},{"id":"S004","event_id":"E01","title":"Đứng ở sân ga chiều ngược, nhờ chỉ đúng bên","branch":"misunderstanding","origin":"ai_authored","uid":"2f02b243-cae3-5107-bff3-aa7a1e38f18c","level":"Sơ","dialogue":{"context_vi":"Bạn đang đứng trên một sân ga ở ga Aoba và muốn đến ga Sakura. Bạn chưa chắc đây có phải chiều đi đúng nên hỏi nhân viên.","speakers":[{"id":"a","role_vi":"người học","gender":"female"},{"id":"b","role_vi":"nhân viên ga","gender":"male"}],"turns":[{"id":"2f02b243-cae3-5107-bff3-aa7a1e38f18c-u01","speaker_id":"a","ja":"すみません、桜駅へ行きます。このホームでいいですか。","vi":"Xin lỗi, tôi đi ga Sakura. Đứng sân ga này đúng không ạ?"},{"id":"2f02b243-cae3-5107-bff3-aa7a1e38f18c-u02","speaker_id":"b","ja":"いいえ、ここは反対方向です。","vi":"Không, đây là chiều ngược lại."},{"id":"2f02b243-cae3-5107-bff3-aa7a1e38f18c-u03","speaker_id":"a","ja":"そうですか。どちらのホームですか。","vi":"Vậy ạ. Sân ga nào mới đúng ạ?"},{"id":"2f02b243-cae3-5107-bff3-aa7a1e38f18c-u04","speaker_id":"b","ja":"向かいの２番線です。あちらのホームへどうぞ。","vi":"Sân ga số 2 ở phía đối diện. Mời chị sang sân ga đó."},{"id":"2f02b243-cae3-5107-bff3-aa7a1e38f18c-u05","speaker_id":"a","ja":"向かいの２番線ですね。","vi":"Sân ga số 2 phía đối diện ạ."}]}},{"id":"S005","event_id":"E01","title":"Nhắc lại ga đổi và sân ga mới","branch":"resolved","origin":"ai_authored","continues_from":["S004"],"uid":"68b27ce2-cdc7-550e-a748-0b7dfe400a8c","level":"Sơ","dialogue":{"context_vi":"Nhân viên vừa báo bạn đang đứng ở sân ga đi ngược hướng. Trước khi sang sân ga khác, bạn kiểm lại ga đổi và sân ga đúng.","speakers":[{"id":"a","role_vi":"người học","gender":"female"},{"id":"b","role_vi":"nhân viên ga","gender":"male"}],"turns":[{"id":"68b27ce2-cdc7-550e-a748-0b7dfe400a8c-u01","speaker_id":"a","ja":"確認してもいいですか。ここが青葉駅で、ここで乗り換えですね。","vi":"Tôi hỏi lại được không ạ? Đây là ga Aoba và tôi đổi tàu ở đây, đúng không ạ?"},{"id":"68b27ce2-cdc7-550e-a748-0b7dfe400a8c-u02","speaker_id":"b","ja":"はい、ここで乗り換えです。","vi":"Vâng, chị đổi tàu ở đây."},{"id":"68b27ce2-cdc7-550e-a748-0b7dfe400a8c-u03","speaker_id":"a","ja":"桜駅へは、向かいの２番線ですね。","vi":"Để đến ga Sakura thì sang sân ga số 2 phía đối diện, đúng không ạ?"},{"id":"68b27ce2-cdc7-550e-a748-0b7dfe400a8c-u04","speaker_id":"b","ja":"そうです。あちらの２番線、桜方面です。","vi":"Đúng rồi. Sân ga số 2 phía kia, hướng Sakura."},{"id":"68b27ce2-cdc7-550e-a748-0b7dfe400a8c-u05","speaker_id":"a","ja":"わかりました。向かいへ行きます。","vi":"Tôi hiểu rồi. Tôi sẽ sang phía đối diện."}]}},{"id":"S006","event_id":"E02","title":"Hỏi xe này có dừng trước địa điểm cần đến","branch":"routine","origin":"ai_authored","uid":"25ad555b-8021-5d65-8c3b-e53b723c403a","level":"Sơ","dialogue":{"context_vi":"Ở trạm xe buýt, bạn muốn đến thư viện. Trước khi lên, hỏi lái xe xem xe này có dừng ở bến gần thư viện không.","speakers":[{"id":"a","role_vi":"người học","gender":"female"},{"id":"b","role_vi":"lái xe","gender":"male"}],"turns":[{"id":"25ad555b-8021-5d65-8c3b-e53b723c403a-u01","speaker_id":"a","ja":"すみません、このバスは図書館前に止まりますか。","vi":"Xin lỗi, xe này có dừng ở bến Thư viện không ạ?"},{"id":"25ad555b-8021-5d65-8c3b-e53b723c403a-u02","speaker_id":"b","ja":"はい、止まります。","vi":"Có, xe có dừng."},{"id":"25ad555b-8021-5d65-8c3b-e53b723c403a-u03","speaker_id":"a","ja":"ここからいくつ目ですか。","vi":"Từ đây là bến thứ mấy ạ?"},{"id":"25ad555b-8021-5d65-8c3b-e53b723c403a-u04","speaker_id":"b","ja":"ここから三つ目です。","vi":"Từ đây là bến thứ ba."},{"id":"25ad555b-8021-5d65-8c3b-e53b723c403a-u05","speaker_id":"a","ja":"三つ目ですね。ありがとうございます。","vi":"Bến thứ ba ạ. Cảm ơn anh."}]}},{"id":"S007","event_id":"E02","title":"Hỏi lên cửa nào và trả tiền lúc nào","branch":"routine","origin":"ai_authored","uid":"52f40bb7-9557-5778-a222-b3e2006859b0","level":"Sơ","dialogue":{"context_vi":"Bạn sắp lên một xe Toei Bus trong 23 quận Tokyo. Trước cửa xe, bạn hỏi lái xe lối lên và thời điểm trả tiền.","speakers":[{"id":"a","role_vi":"người học","gender":"female"},{"id":"b","role_vi":"lái xe","gender":"male"}],"turns":[{"id":"52f40bb7-9557-5778-a222-b3e2006859b0-u01","speaker_id":"a","ja":"すみません、どこから乗りますか。","vi":"Xin lỗi, tôi lên xe từ cửa nào ạ?"},{"id":"52f40bb7-9557-5778-a222-b3e2006859b0-u02","speaker_id":"b","ja":"前のドアからどうぞ。","vi":"Mời chị lên từ cửa trước."},{"id":"52f40bb7-9557-5778-a222-b3e2006859b0-u03","speaker_id":"a","ja":"お金はいつ払いますか。","vi":"Tôi trả tiền lúc nào ạ?"},{"id":"52f40bb7-9557-5778-a222-b3e2006859b0-u04","speaker_id":"b","ja":"乗るときに払ってください。","vi":"Chị trả lúc lên xe."},{"id":"52f40bb7-9557-5778-a222-b3e2006859b0-u05","speaker_id":"a","ja":"わかりました。ここで払います。","vi":"Tôi hiểu rồi. Tôi trả ở đây ạ."}]}},{"id":"S008","event_id":"E02","title":"Xe không đi thẳng, hỏi điểm chuyển xe","branch":"conditional","origin":"ai_authored","uid":"ea8e465e-3b20-539c-8168-255b71403c65","level":"Sơ","dialogue":{"context_vi":"Tại trạm xe buýt, bạn muốn đến bến Bệnh viện nhưng chưa biết xe trước mặt có đi thẳng tới đó không. Bạn hỏi lái xe trước khi lên.","speakers":[{"id":"a","role_vi":"người học","gender":"female"},{"id":"b","role_vi":"lái xe","gender":"male"}],"turns":[{"id":"ea8e465e-3b20-539c-8168-255b71403c65-u01","speaker_id":"a","ja":"すみません、このバスで病院前まで行けますか。","vi":"Xin lỗi, đi xe này có tới bến Bệnh viện không ạ?"},{"id":"ea8e465e-3b20-539c-8168-255b71403c65-u02","speaker_id":"b","ja":"いいえ。このバスは中央公園までです。","vi":"Không. Xe này chỉ đến bến Công viên Trung tâm."},{"id":"ea8e465e-3b20-539c-8168-255b71403c65-u03","speaker_id":"a","ja":"どこで乗り換えますか。","vi":"Tôi đổi xe ở đâu ạ?"},{"id":"ea8e465e-3b20-539c-8168-255b71403c65-u04","speaker_id":"b","ja":"中央公園で降りて、病院前行きに乗ってください。","vi":"Chị xuống ở bến Công viên Trung tâm rồi lên xe đi bến Bệnh viện."},{"id":"ea8e465e-3b20-539c-8168-255b71403c65-u05","speaker_id":"a","ja":"中央公園で降りるんですね。","vi":"Vậy tôi xuống ở bến Công viên Trung tâm ạ?"},{"id":"ea8e465e-3b20-539c-8168-255b71403c65-u06","speaker_id":"b","ja":"はい。降りたら、次のバスの乗り場を確認してください。","vi":"Đúng rồi. Sau khi xuống, chị hãy kiểm tra chỗ đón xe tiếp theo."}]}},{"id":"S009","event_id":"E02","title":"Nhỡ bến, h ","vi":"chỗ chênh cao, bậc gờ"}],"つらい":[{"reading":"つらい","han_viet":"","vi":"khó chịu, vất vả (khi làm gì)"}],"案内する":[{"reading":"あんないする","han_viet":"ÁN NỘI","vi":"hướng dẫn, chỉ đường"}],"確認する":[{"reading":"かくにんする","han_viet":"XÁC NHẬN","vi":"kiểm tra, xác nhận lại"}],"見せる":[{"reading":"みせる","han_viet":"KIẾN","vi":"cho xem, đưa cho xem"}],"待つ":[{"reading":"まつ","han_viet":"ĐÃI","vi":"đợi, chờ"}]}},"lecture":{"id":"da5c16e5-9425-5a4f-9086-8c109aa79c90-lecture","type":"knowledge","title_vi":"Hỏi đường đi tàu điện và xe buýt","data":{"body_md":"## Tàu này có dừng ở ga mình cần không?\n\nBạn muốn đến ga Sakura. Tàu đã tới, nhưng bạn chưa biết chuyến này có dừng ở đó không. Thử nói câu đầu với nhân viên ga. Ngắt nhẹ sau **すみません** để gọi người nghe, rồi nói rõ tên ga.\n\n{{utterance:ex01}}\n\nNhân viên đáp:\n\n{{utterance:ex02}}\n\nNghe **青葉駅まで**, bạn biết tàu này chỉ đưa mình tới Aoba. Để biết Aoba có phải ga đổi không, bạn cần hỏi thêm. Thử nhắc lại tên ga vừa nghe trong câu hỏi.\n\n{{utterance:ex03}}\n\n{{utterance:ex04}}\n\nCùng dịch là “ở”, nhưng trong **桜駅に止まる**, **に** đi với điểm tàu dừng. Trong **青葉駅で乗り換える**, **で** đi với chỗ bạn đổi tàu. Nếu chỉ nghe được từ **乗り換え** mà chưa bắt được tên ga, giữ động từ và thay tên ga bằng **どこで**.\n\n{{utterance:ex05}}\n\nNếu ngay từ đầu bạn nghe **はい** và **止まります**, nhân viên xác nhận tàu có dừng ở Sakura. Bạn có thể cảm ơn và kết thúc lượt hỏi đó. Nếu bạn cần biết có đi một mạch tới nơi không, có thể hỏi bằng **直通** (ちょくつう), nghĩa là đi thẳng, không cần đổi tàu.\n\n{{utterance:ex06}}\n\n## Hỏi lại khi đứng nhầm sân ga\n\nĐã đến Aoba, bạn hỏi tàu hướng Sakura đón khách ở sân ga số mấy. **方面** (ほうめん) nói về hướng. **番線** (ばんせん) đi với số để chỉ chỗ đón tàu. Nếu đã đứng trên một sân ga và muốn kiểm tra ngay chỗ mình đang đứng, dùng **このホーム** khi nói với nhân viên.\n\n{{utterance:ex07}}\n\n{{utterance:ex08}}\n\nVới câu sau, nhân viên có thể sửa như sau:\n\n{{utterance:ex09}}\n\nTrong câu đáp, nghe **反対方向** để biết mình đứng nhầm chiều và **向かい** để biết chỗ đúng nằm phía đối diện. Nếu chỉ nghe được rằng mình đứng nhầm chiều, dùng lại câu hỏi với **何番線** để biết sang sân ga nào. Nếu còn chưa chắc ga mình đứng có phải Aoba không, nêu **青葉駅** để xác nhận trước. Khi cả hai đã rõ đó là ga nào, dùng **ここ** để hỏi xem có đổi tàu ngay tại đây không.\n\n{{utterance:ex10}}\n\nKhi nhân viên xác nhận, nhắc lại chỗ đi tiếp bằng **～ですね**. Bạn có thể nhắc trọn **向かいの２番線** nếu vừa phải sửa cả phía lẫn số. Nếu nghe được số rồi mà còn lúng túng ở cầu thang, chỉ vào lối mình định đi và hỏi bằng **こちら**. Nghe **その先** thì hiểu là cầu thang ở xa hơn lối bạn vừa chỉ.\n\n{{utterance:ex11}}\n\n{{utterance:ex12}}\n\n## Dùng lại câu hỏi khi chuyển sang xe buýt\n\nGiữ khung **この～は［tên nơi］に止まりますか**. Thay **電車** bằng **バス** và thay tên ga bằng tên bến. Thử hỏi tài xế xem xe có dừng ở bến Thư viện.\n\n{{utterance:ex13}}\n\nNếu tài xế nói xe có dừng, bạn có thể hỏi từ đây là bến thứ mấy. Trong lời đáp **三つ目**, phần **目** cho biết thứ tự. Nghe được **三つ目** thì nhắc lại bến thứ ba bằng **～ですね**.\n\n{{utterance:ex14}}\n\nNếu cần tới bến Bệnh viện mà tài xế đáp **中央公園まで**, dùng lại câu hỏi chỗ đổi với **どこで** như khi đi tàu. Nghe lời đáp theo hai nhịp, mỗi nhịp cho bạn một thông tin để nhắc lại.\n\n{{utterance:ex15}}\n\n**中央公園で降りて** nói chỗ xuống. **病院前行きに乗って** nói xe sẽ lên. Khi vừa xuống, hỏi **乗り場**, tức chỗ đón chuyến kế tiếp.\n\n{{utterance:ex16}}\n\nCòn khi hỏi cửa lên, **どのドアから** giúp tài xế trả lời bằng tên cửa, chẳng hạn **前のドアから**, từ cửa trước. Trong câu hỏi tiền vé, **とき** biến hành động phía trước thành thời điểm. Thử đổi từ **乗る** sang **降りる** nếu bạn muốn xác nhận có phải trả lúc xuống xe.\n\n{{utterance:ex17}}\n\n{{utterance:ex18}}\n\nNếu tài xế đáp như dưới đây, từ cần bắt là **乗る**. Bạn có thể nhắc lại **乗るとき** với **ですね** trước khi trả tiền.\n\n{{utterance:ex19}}\n\n## Nói gì khi đã đi quá bến?\n\nBạn nghi đã đi quá bến Thư viện. Hỏi tài xế bằng **過ぎる** (すぎる), đi qua. Ở đây, **を** đánh dấu bến xe đã đi qua.\n\n{{utterance:ex20}}\n\nTài xế nói:\n\n{{utterance:ex21}}\n\nNghe **さっき**, bạn biết việc đó vừa xảy ra. Hỏi tiếp bến nào có thể xuống. **降りられますか** hỏi “có thể xuống được không”, còn **どこで** kéo câu trả lời về tên bến cụ thể.\n\n{{utterance:ex22}}\n\nNếu nghe tài xế chỉ **市民会館前**, nhắc lại tên bến để kiểm tra. Nếu thấy nút mà chưa biết có phải nút báo xuống hay không, chỉ vào đó và hỏi một người đi cùng.\n\n{{utterance:ex23}}\n\nSau khi xuống, bạn gọi cho người bạn đang đợi. Chuyển sang giọng thân mật. Dùng **よ** khi báo bạn vừa xuống ở đâu. Với **少し遅れる**, bạn báo mình sẽ muộn mà chưa cần nói mấy phút.\n\n{{utterance:ex24}}\n\n{{utterance:ex25}}\n\nNghe **待ってるね**, bạn biết bạn mình sẽ chờ tại điểm hẹn. Để báo sẽ liên lạc lại sau khi biết đường quay về, dùng **また連絡する** và thêm **ね** như khi bạn mình nói sẽ đợi.\n\n## Nói rõ mình cần lối có thang máy\n\nKhi xách nhiều hành lý, hỏi vị trí thang máy bằng **どちら**. Nhân viên có thể đáp bằng một mốc ngắn. Trong câu bên dưới, **改札** là cổng soát vé, còn **右** là phía bên phải của cổng.\n\n{{utterance:ex26}}\n\n{{utterance:ex27}}\n\nNếu mẹ bạn khó đi cầu thang, hãy nói lý do trước. **～んです** ở đây giúp người nghe hiểu vì sao bạn cần hỏi. Sau đó hỏi bằng **エレベーターで** để người nghe biết bạn cần đi **bằng thang máy** tới tận sân ga.\n\n{{utterance:ex28}}\n\n{{utterance:ex29}}\n\nNếu có một lối ngay trước mặt, vừa chỉ vừa hỏi với **こちらから**.\n\n{{utterance:ex30}}\n\nKhi nghe nhân viên chỉ **突き当たりを左**, hãy nhắc lại cả mốc cuối lối đi lẫn hướng rẽ. Nói mỗi **左** sẽ để ngỏ chỗ cần rẽ.\n\n{{utterance:ex31}}\n\n## Nghe xem nhân viên đã xác nhận chỗ gặp chưa\n\nBạn sẽ đổi tàu ở Aoba và cần nhân viên chỉ lối cho mẹ tới sân ga của chuyến sau. Nêu **青葉駅** là nơi đổi, rồi nhắc lại việc mẹ khó đi cầu thang. Nếu nhân viên đáp như dưới đây, bắt phần cuối **します**. Họ sẽ kiểm tra với ga Aoba. Câu tiếp theo của bạn hỏi mình nên chờ ở đâu **bây giờ**.\n\n{{utterance:ex32}}\n\n{{utterance:ex33}}\n\nNhân viên có thể chỉ **改札の横**, bên cạnh cổng soát vé. Khi họ quay lại, nghe xem **します** đã đổi thành **しました** chưa. Ở đây, phần cuối câu cho biết việc kiểm tra đã xong. Lần này bạn nhắc lại **điểm gặp sau khi xuống tàu ở Aoba**.\n\n{{utterance:ex34}}\n\n{{utterance:ex35}}\n\n## Nhờ nhân viên xem vé\n\nKhi vé giấy không qua được cổng, mở lời bằng điều bạn vừa gặp. **この切符で** nghĩa là “với vé này”. Bạn có thể chỉ vào vé khi nói.\n\n{{utterance:ex36}}\n\nNếu nghe nhân viên nói họ kiểm tra ở **窓口** (まどぐち), bạn có thể dùng lại câu hỏi vị trí với **どちら**. Lần này, thay **エレベーター** bằng **窓口**.\n\n{{utterance:ex37}}\n\n{{utterance:ex38}}\n\nNghe **見せてください** thì đưa vé ra và đáp **お願いします**. Trong lúc đưa vé, cụm ngắn này đã đủ để nhờ người kia xem giúp.\n\n## Thử nói trọn một lượt hỏi\n\nLần này bạn muốn xuống ở ga Midori. Hãy nói to câu hỏi tàu có dừng ở đó không, rồi đọc câu đáp của nhân viên. Khi nghe **まで**, thử nhắc lại ga đổi trước khi nhìn câu cuối.\n\n{{utterance:ex39}}\n\n{{utterance:ex40}}\n\n{{utterance:ex41}}\n\nGiờ tự đổi vai. Làm nhân viên, đọc câu báo tàu chỉ tới Chūō ở trên. Dừng một nhịp, trở lại vai hành khách và hỏi xem có đổi tàu ở Chūō không. Làm lại với lời đáp bên dưới. Lần này nghe thấy tàu có dừng ở Midori thì đáp bằng một lời cảm ơn.\n\n{{utterance:ex42}}\n\nNếu lỡ mất tên ga, xin người kia nhắc lại trước khi nói tiếp.\n\n{{utterance:ex43}}","utterance_ids":["ex01","ex02","ex03","ex04","ex05","ex06","ex07","ex08","ex09","ex10","ex11","ex12","ex13","ex14","ex15","ex16","ex17","ex18","ex19","ex20","ex21","ex22","ex23","ex24","ex25","ex26","ex27","ex28","ex29","ex30","ex31","ex32","ex33","ex34","ex35","ex36","ex37","ex38","ex39","ex40","ex41","ex42","ex43"],"video_status":"planned","source_family":"general"},"utterances":[{"id":"ex01","ja":"すみません、この電車は桜駅に止まりますか。","vi":"Xin lỗi, tàu này có dừng ở ga Sakura không ạ?"},{"id":"ex02","ja":"いいえ、この電車は青葉駅までです。","vi":"Không ạ, tàu này chỉ đến ga Aoba."},{"id":"ex03","ja":"青葉駅で乗り換えですか。","vi":"Tôi đổi tàu ở ga Aoba phải không ạ?"},{"id":"ex04","ja":"はい、青葉駅で乗り換えてく
