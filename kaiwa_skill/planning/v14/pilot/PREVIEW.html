":"nội dung cần chuyển lại cho người xử lý tiếp"}],"期限":[{"reading":"きげん","han_viet":"KỲ HẠN","vi":"hạn chót để hoàn thành hoặc báo lại"}],"判断待ち":[{"reading":"はんだんまち","han_viet":"PHÁN ĐOÁN ĐÃI","vi":"đang chờ người có trách nhiệm quyết định"}]}},"lecture":{"id":"cba953ce-d3d0-5e71-acb8-419cd0e708a1-lecture","type":"knowledge","title_vi":"Đề xuất và đối đáp trong cuộc họp","data":{"body_md":"## Mở lời để biết cả nhóm đang bàn đến đâu\n\nBạn muốn đề nghị phòng Tổng vụ thử dùng một mẫu trả lời chung. Trước khi đưa ý kiến, bạn hỏi người chủ trì xem hôm nay cả nhóm định chốt việc gì.\n\n{{utterance:ex01}}\n\nTakahashi đáp.\n\n{{utterance:ex02}}\n\n**何を** hỏi việc gì, còn **どこまで** hỏi đến mức nào. Bạn có thể đổi phần **今日の会議では** thành **この件については** để hỏi riêng về một việc. Trong câu đáp, **だけ** giới hạn việc sẽ chốt ở **方針**, hướng xử lý. Nếu bạn nghe một đồng nghiệp tưởng bảng ước tính cũng có nghĩa là ngân sách sắp được duyệt, hãy làm rõ bằng một câu về mục đích của bảng và một câu về tình trạng duyệt.\n\n{{utterance:ex03}}\n\nĐến lúc cần chen lời, thử nói câu xin lượt trước, ngừng một nhịp rồi mới nêu lý do. Với người chủ trì, **確認させてください** cho thấy bạn xin làm rõ một điểm trước khi nhóm tiếp tục.\n\n{{utterance:ex04}}\n\n## Hỏi đúng chỗ mình chưa rõ trong số liệu\n\nMột đồng nghiệp nói khoảng một phần ba câu hỏi tháng trước bị trùng. Khi bạn hỏi thêm, anh ấy đáp.\n\n{{utterance:ex05}}\n\n**確認済み** chỉ phần đã kiểm. **暫定** nói số hiện đang dùng còn có thể thay đổi. Nghe **約** và **まだ暫定**, bạn có thể hỏi **theo tài liệu nào** hoặc **đếm những gì**. Nếu sổ tiếp nhận đã rõ mà tiêu chí đếm còn mơ hồ, hỏi câu thứ hai sẽ đi thẳng vào điểm có thể làm tỷ lệ thay đổi.\n\n{{utterance:ex06}}\n\n{{utterance:ex07}}\n\nBạn giữ đuôi **～か、教えていただけますか** và thay câu hỏi ở trước **か**. Cả hai câu đều cho người nghe biết chính xác bạn cần chi tiết nào làm **根拠**, căn cứ. Nếu đồng nghiệp nghĩ bạn đang nghi ngờ số anh ấy tổng hợp, hãy nhận phần diễn đạt của mình rồi nói cụ thể điều muốn kiểm.\n\n{{utterance:ex08}}\n\n{{utterance:ex09}}\n\nVế **確認したいのは** đưa cuộc nói trở lại tiêu chí. Nếu anh ấy nói đã tính cả câu hỏi gần giống, bạn có thể nối bằng **分類の基準をそろえて** rồi đề nghị cùng đếm lại.\n\n## Nêu một phương án rồi nghe xem người kia đồng ý đến đâu\n\nĐến lượt bạn đề xuất. **まず** cho thấy đây là bước đầu. **～てみませんか** mời cả nhóm thử. Muốn đưa ra cùng ý ấy với giọng trang trọng hơn, bạn có thể nối thể **～てみる** với **のはいかがでしょうか**.\n\n{{utterance:ex10}}\n\n{{utterance:ex11}}\n\nNghe câu đáp của người có quyền quyết. Nếu họ mới cân nhắc, bạn có thể nghe câu này.\n\n{{utterance:ex12}}\n\nNếu họ đã quyết cho thử, bạn có thể nghe câu này.\n\n{{utterance:ex13}}\n\nỞ câu đầu, **なら** giới hạn điều có thể cân nhắc. **概要を共有したところ** cho biết người ta vừa thông báo qua. Khi nghe **了解が取れた** ở câu thứ hai, bạn biết người phụ trách đã đồng ý. Còn **始めてください** là lời giao bắt đầu. Bạn có thể đáp **承知しました** rồi nhắc lại **総務部だけで** để xác nhận phạm vi. Nếu mới chia sẻ và còn phải hỏi người trực tiếp làm, hãy xin lùi quyết định và nhận phần việc bạn làm được.\n\n{{utterance:ex14}}\n\nKhi người chủ trì hỏi bạn định xem kết quả thế nào, hãy nói điều bạn có thể quan sát. Với **～かどうかを見ます**, bạn thay phần trước **かどうか** bằng điều cần xem. Nếu nói về lỗi, có thể dùng **～たら、いったん～ます** để nêu việc mình sẽ làm khi lỗi xảy ra.\n\n{{utterance:ex15}}\n\nNếu người kia hỏi có kết quả sau hai tuần không, **～は出せます** giúp bạn nói rõ phần mình có thể đưa ra. **中間確認** là lần xem tình hình giữa đợt thử.\n\n{{utterance:ex16}}\n\n## Ghi nhận phản biện rồi sửa một điểm\n\nĐồng nghiệp lo cả việc tiếp nhận lẫn việc kiểm tra câu trả lời sẽ dồn về Tổng vụ. Ngay cả khi bạn nói chỉ thử một phần, anh ấy vẫn hỏi.\n\n{{utterance:ex17}}\n\nHãy nói đúng điểm bạn thấy có lý. **確かに** mở lời ghi nhận. **おっしゃるとおりです** tán thành rõ hơn và hợp khi bạn thật sự đồng ý với nhận xét của người ở vai trên. Nếu đang đồng ý một phần rồi nêu ý khác, hãy nói rõ phần bạn vừa công nhận.\n\n{{utterance:ex18}}\n\n**～だけに絞るのはどうでしょうか** đưa cách sửa ra để cùng bàn. Đến khi bạn đã sửa đề xuất, dùng **ご指摘を踏まえて、～に絞りました** để nói mình đã thay đổi phần nào sau khi nghe góp ý. Đuôi **～ました** ở đây nói về việc sửa đề xuất. Quyết định có chạy thử vẫn là một lượt nói khác.\n\n{{utterance:ex19}}\n\nCó thể đồng nghiệp đã yên tâm về số lượng yêu cầu nhưng vẫn lo một người không xoay xở nổi. Lúc đó, **そこは担当の方に聞いてみます** giúp bạn nhận đúng phần còn phải làm rõ.\n\n**Thử đổi sang một cuộc họp khác.** Bạn muốn rút cuộc họp hằng tuần xuống 15 phút. Đồng nghiệp lo mọi người sẽ hết giờ để hỏi. Hãy nói thành tiếng hai câu, một câu công nhận điều họ lo và một câu đề xuất cách sửa. Bạn có thể giữ **確かに** và **～のはどうでしょうか**, rồi thay phần ở giữa bằng ý của mình. Dưới đây là một cách đáp.\n\n{{utterance:ex20}}\n\n## Đáp khi phương án bị gác lại\n\nNgười chủ trì nói tháng này nhóm sẽ giữ đầu mối hiện tại.\n\n{{utterance:ex21}}\n\n**見送る** cho biết lần này đã quyết gác. **保留** giữ một việc ở trạng thái chờ quyết. Cùng một phương án có thể bị gác trong tháng này và vẫn để ngỏ về sau. Nếu nghe **検討します**, hãy để ý người nói có nêu mốc hay điều kiện xem lại không. Có thể họ đang để ngỏ để xem xét thêm, cũng có thể họ đang từ chối nhẹ.\n\nKhi muốn biết lý do, dùng **～た理由を伺ってもよろしいでしょうか**. Khi muốn hỏi còn cơ hội nào, dùng **～する余地はありますか**. Ở câu thứ hai dưới đây, **～た上で** đặt việc xác nhận trước việc trình lại.\n\n{{utterance:ex22}}\n\n{{utterance:ex23}}\n\nNếu trước mắt bạn sẽ hỗ trợ đầu mối hiện tại, hãy đáp lời rồi nói rõ việc mình nhận.\n\n{{utterance:ex24}}\n\nNếu muốn giữ ý tưởng để bàn lại, thử đặt điều kiện bằng **～ようなら**, rồi hỏi người chủ trì.\n\n{{utterance:ex25}}\n\nKhi đã thấy lời hướng dẫn khác nhau, bạn có thể nói mình đã kiểm được gì và xin một dịp trao đổi khi rõ ảnh hưởng.\n\n{{utterance:ex26}}\n\nNếu nghe **～てから判断します**, hãy để ý bước phải xảy ra trước. Chẳng hạn, người chủ trì có thể chờ xem kết quả rồi mới quyết có họp lại hay không.\n\n## Nhắc lại quyết định và biết khi nào cần nói tiếp\n\nSau cuộc họp, một người bảo cả đợt thử đã được duyệt, còn trưởng nhóm hiểu là vẫn chờ. Hãy hỏi lại người chủ trì bằng tên việc cụ thể. Mẫu **～という理解で合っていますか** cho người nghe cơ hội sửa đúng phần bạn nghe lệch.\n\n{{utterance:ex27}}\n\nNgười chủ trì xác nhận cách hiểu đó và dặn chưa gửi đề nghị thử. Lúc này **～ておきます** dùng để nhận phần việc bạn sẽ làm sẵn. Nói gọn một việc và một mốc là đủ.\n\n{{utterance:ex28}}\n\nKhi nói lại với người tưởng cả đợt thử đã được duyệt, hãy mở bằng nơi bạn vừa xác nhận. **～だそうです** cho biết phần sau là thông tin bạn nghe được từ người ấy.\n\n{{utterance:ex29}}\n\nTrưởng nhóm dặn bạn để ý xem có ai bị ảnh hưởng không.\n\n{{utterance:ex30}}\n\nNghe **～たら** để biết lúc nào cần báo. Giả sử đã có một người phải hỏi lại. Bạn mở lời bằng việc vừa xảy ra rồi nói phần còn đang kiểm. Ngắt một nhịp giữa hai câu để người nghe bắt được cả hai ý.\n\n{{utterance:ex31}}\n\nTrưởng nhóm trả lời.\n\n{{utterance:ex32}}\n\n**私から** cho biết chính trưởng nhóm sẽ báo. Bạn có thể nối bằng lời đề nghị có mặt khi cần làm rõ thêm.\n\n{{utterance:ex33}}\n\n## Nói lại cả mạch\n\nThử ráp bốn lượt của bạn. Mở bằng **一点だけ確認させてください**, đưa một phương án với **～てみませんか**, nghe người kia nói họ lo gì rồi đáp **確かに、～**. Nếu nhóm chỉ mới đồng ý một phần, thử nói lại chính phần đó với **～という理解で合っていますか**. Lần sau, đổi phương án hoặc mối lo và giữ nguyên mạch đối đáp.","utterance_ids":["ex01","ex02","ex03","ex04","ex05","ex06","ex07","ex08","ex09","ex10","ex11","ex12","ex13","ex14","ex15","ex16","ex17","ex18","ex19","ex20","ex21","ex22","ex23","ex24","ex25","ex26","ex27","ex28","ex29","ex30","ex31","ex32","ex33"],"video_status":"planned","source_family":"general"},"utterances":[{"id":"ex01","ja":"今日の会議では、どこまで決める想定でしょうか。","vi":"Cuộc họp hôm nay dự kiến chốt đến đâu ạ?"},{"id":"ex02","ja":"今日は問い合わせ対応の方針だけ決めます。","vi":"Hôm nay ta chỉ chốt hướng xử lý các câu hỏi thôi."},{"id":"ex03","ja":"この見積もりは案を比べるためのものです。予算の承認はまだです。","vi":"Bảng ước tính này dùng để so các phương án. Ngân sách vẫn chưa được duyệt ạ."},{"id":"ex04","ja":"方針を決める前に、一点だけ確認させてください。部署によって受付の条件が違うと、同じ文面では誤案内になるおそれがあります。","vi":"Trước khi chốt hướng xử lý, cho tôi làm rõ một điểm ạ. Nếu các bộ phận có điều kiện tiếp nhận khác nhau, dùng chung một mẫu có thể dẫn đến hướng dẫn sai."},{"id":"ex05","ja":"百二十件という総数は確認済みです。重複は約四十件ですが、まだ暫定です。","vi":"Tổng số 120 đã được kiểm tra. Số câu hỏi trùng là khoảng 40, hiện vẫn là số tạm tính."},{"id":"ex06","ja":"重複の件数を出すのに、どの資料を使ったか教えていただけますか。","vi":"Anh cho tôi biết đã dùng tài liệu nào để tính số trường hợp trùng lặp được không ạ?"},{"id":"ex07","ja":"似た質問も重複に含めたか、教えていただけますか。","vi":"Anh cho tôi hỏi các câu hỏi gần giống nhau có được tính là trùng không ạ?"},{"id":"ex08","ja":"私の集計が信用できないということですか。","vi":"Ý cô là số tôi tổng hợp không đáng tin à?"},{"id":"ex09","ja":"聞き方が分かりにくくてすみません。確認したいのは、どこまでを重複に含めたかです。","vi":"Xin lỗi, tôi hỏi chưa rõ. Điều tôi muốn biết là mình đã tính những trường hợp nào là trùng ạ."},{"id":"ex10","ja":"まず総務部だけで、共通の回答文を使ってみませんか。","vi":"Hay là trước mắt mình thử dùng mẫu trả lời chung ở riêng phòng Tổng vụ?"},{"id":"ex11","ja":"まず総務部だけで、共通の回答文を使ってみるのはいかがでしょうか。","vi":"Anh thấy sao nếu trước mắt mình chỉ thử dùng mẫu trả lời chung ở phòng Tổng vụ ạ?"},{"id":"ex12","ja":"総務部での試行なら考えられます。現場には概要を共有したところです。","vi":"Nếu chỉ thử ở phòng Tổng vụ thì có thể cân nhắc. Tôi mới chia sẻ qua với những người trực tiếp làm."},{"id":"ex13","ja":"総務部の担当者の了解も取れました。では、総務部だけで始めてください。","vi":"Người phụ trách bên Tổng vụ cũng đã đồng ý. Vậy hãy bắt đầu ở riêng phòng Tổng vụ nhé."},{"id":"ex14","ja":"担当の方に負担を聞いてから、試すかどうか決めませんか。確認は私がします。","vi":"Hay là mình hỏi người phụ trách xem họ phải làm thêm những gì rồi mới quyết có thử không ạ? Tôi sẽ hỏi."},{"id":"ex15","ja":"担当者の確認時間が減るかどうかを見ます。誤案内が出たら、その回答文の使用はいったん止めます。","vi":"Tôi sẽ xem thời gian người phụ trách phải kiểm tra có giảm không. Nếu có hướng dẫn sai, tôi sẽ tạm ngừng dùng mẫu trả lời đó."},{"id":"ex16","ja":"二週間で件数は出せます。まずは中間確認にして、効果はもう少し様子を見てから判断しませんか。","vi":"Sau hai tuần tôi có thể đưa số lượt. Hay mình xem đó là lần kiểm tra giữa đợt, rồi theo dõi thêm trước khi đánh giá hiệu quả ạ?"},{"id":"ex17","ja":"ただ、範囲を絞っても確認作業は増えますよね。","vi":"Nhưng dù thu hẹp phạm vi, việc kiểm tra cũng tăng, đúng không?"},{"id":"ex18","ja":"確かに、確認作業は増えそうですね。まずは備品申請に関する質問だけに絞るのはどうでしょうか。","vi":"Đúng là có vẻ sẽ mất thêm công kiểm tra. Hay trước hết mình chỉ thử với câu hỏi về việc xin cấp đồ dùng?"},{"id":"ex19","ja":"ご指摘を踏まえて、試行案の対象を備品申請に関する質問だけに絞りました。全件を引き受けるという懸念は、これで解消できそうですか。","vi":"Theo góp ý của anh, tôi đã sửa đề xuất để chỉ thử với câu hỏi về việc xin cấp đồ dùng. Như vậy đã giải quyết được lo ngại Tổng vụ phải nhận hết mọi yêu cầu chưa ạ?"},{"id":"ex20","ja":"確かに、質問の時間は必要ですね。報告を短くして、最後の五分は質問に充てるのはどうでしょうか。","vi":"Đúng là cần dành thời gian cho câu hỏi. Hay là mình rút ngắn phần báo cáo và dành năm phút cuối để hỏi đáp?"},{"id":"ex21","ja":"今月は試行を見送ります。窓口は今のままです。","vi":"Tháng này ta gác việc chạy thử. Đầu mối tiếp nhận vẫn giữ nguyên."},{"id":"ex22","ja":"今回、試行を見送った理由を伺ってもよろしいでしょうか。","vi":"Cho tôi hỏi vì sao lần này mình gác việc chạy thử ạ?"},{"id":"ex23","ja":"現場の負担を確認した上で、改めて提案する余地はありますか。","vi":"Sau khi hỏi rõ người trực tiếp làm sẽ phải đảm đương thêm bao nhiêu việc, tôi có thể đề xuất lại không ạ?"},{"id":"ex24","ja":"承知しました。では、今の窓口で答えに迷う質問は、私のほうで洗い出します。","vi":"Tôi hiểu rồi ạ. Vậy tôi sẽ rà những câu hỏi khó trả lời ở đầu mối hiện tại."},{"id":"ex25","ja":"手順を見直しても案内の食い違いが続くようなら、試行案をもう一度議題に上げてもよろしいでしょうか。","vi":"Nếu đã chỉnh cách kiểm tra mà các bên vẫn hướng dẫn khác nhau, tôi có thể đưa phương án thử ra bàn lại không ạ?"},{"id":"ex26","ja":"案内が食い違っていることは確認できました。影響が分かったら、もう一度話し合う場を設けていただけますか。","vi":"Tôi đã xác nhận là các bên hướng dẫn khác nhau. Khi biết việc đó ảnh hưởng ra sao, anh có thể sắp xếp để mình bàn lại không ạ?"},{"id":"ex27","ja":"承認されたのは回答の確認手順だけで、試行はまだ保留、という理解で合っていますか。","vi":"Tôi hiểu là mới duyệt cách kiểm tra câu trả lời, còn việc chạy thử vẫn chờ quyết định. Có đúng không ạ?"},{"id":"ex28","ja":"では、今の窓口で答えに迷う質問を、金曜までにまとめておきます。","vi":"Vậy tôi sẽ tổng hợp những câu hỏi khó trả lời ở đầu mối hiện tại chậm nhất vào thứ Sáu ạ."},{"id":"ex29","ja":"部長に確認しました。承認されたのは確認手順だけで、試行はまだ保留だそうです。","vi":"Tôi đã hỏi lại trưởng bộ phận. Anh ấy nói mới chỉ duyệt cách kiểm tra, còn việc chạy thử vẫn chờ quyết định."},{"id":"ex30","ja":"案内の食い違いで聞き直した人がいたら、先に私に知らせてください。","vi":"Nếu có ai phải hỏi lại vì hướng dẫn không thống nhất thì báo tôi trước nhé."},{"id":"ex31","ja":"備品申請をした方お一人から、部署によって案内が違うと問い合わせがありました。ほかにも同じことが起きていないか、確認中です。","vi":"Có một người xin cấp đồ dùng đã hỏi lại vì mỗi phòng hướng dẫn một kiểu. Tôi đang kiểm tra xem còn ai gặp tình trạng đó không ạ."},{"id":"ex32","ja":"分かりました。私から部長に報告します。","vi":"Tôi hiểu rồi. Tôi sẽ báo trưởng bộ phận."},{"id":"ex33","ja":"必要でしたら、私も同席します。","vi":"Nếu cần, tôi cũng sẽ tham gia buổi trao đổi ạ."}]}}],"content":{},"pilot_stages":["da5c16e5-9425-5a4f-9086-8c109aa79c90","fc19cbb2-ccaf-5c9c-aadf-f59a4a77edf8","cba953ce-d3d0-5e71-acb8-419cd0e708a1"],"branches":{"routine":"Tiến hành","misunderstanding":"Hiểu nhầm","resolved":"Đã xử lý","conditional":"Có điều kiện","follow_up":"Tiếp nối","declined":"Từ chối","problem":"Gặp trở ngại","alternative":"Phương án khác","pending":"Chờ","accepted":"Đồng ý","unresolved":"Chưa giải quyết"}}</script>
<script>
"use strict";
const course = JSON.parse(document.getElementById("course-data").textContent);
const levels = [...new Set(course.stages.map(stage => stage.level))];
const types = {
  vocabulary: { label: "Từ vựng", icon: "字" },
  speak_video: { label: "Video Speak Japanese", icon: "▶" },
  speak_shadow: { label: "Shadowing Speak Japanese", icon: "♫" },
  shadowing: { label: "Shadowing", icon: "◖" },
  reading: { label: "Tài liệu bổ trợ", icon: "▤" },
  lecture: { label: "Bài giảng chặng", icon: "▣" },
  situations: { label: "Thực hành tình huống", icon: "☏" },
  challenge: { label: "Challenge Live AI", icon: "ϟ" },
  free: { label: "Free Kaiwa", icon: "✦" }
};
if (["6.4", "6.5", "8.0"].includes(course.version)) {
  delete types.speak_video;
  delete types.speak_shadow;
}
if (["6.5", "8.0"].includes(course.version)) delete types.reading;
if (/^(7|9|10|11|12|13|14)\./.test(course.version)) {
  delete types.speak_video;
  delete types.speak_shadow;
  types.reading.label = "Kiến thức Speak Japanese";
}
const byId = new Map(course.stages.map(stage => [stage.uid, stage]));
const specialtyCategories = {
  patterns: { label: "Mẫu câu thông dụng", icon: "型" },
  mini: { label: "Cụm từ ngắn dùng ngay", icon: "↗" },
  keigo: { label: "Kính ngữ", icon: "礼" },
  idioms: { label: "Câu quán ngữ", icon: "結" },
  emotion: { label: "Truyền đạt cảm xúc", icon: "♡" }
};
const stageLists = Object.fromEntries(levels.map(level => [level, course.stages.filter(s => s.level === level)]));
const $ = id => document.getElementById(id);
function make(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}
function button(text, handler, className) {
  const element = make("button", className, text);
  element.type = "button";
  element.addEventListener("click", handler);
  return element;
}
function readPreference(key, fallback) {
  try { return JSON.parse(localStorage.getItem("kaiwa-review:" + key)) ?? fallback; }
  catch { return fallback; }
}
function savePreference(key, value) {
  try { localStorage.setItem("kaiwa-review:" + key, JSON.stringify(value)); }
  catch { /* Reading remains available when storage is disabled. */ }
}
function icon(type, small = false) {
  const element = make("span", "icon kind-" + type + (small ? " small" : ""), types[type].icon);
  element.setAttribute("aria-hidden", "true");
  return element;
}
function fold(text) {
  return text.normalize("NFD").replace(/\p{M}/gu, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
}
const pad = (n, size = 2) => String(n).padStart(size, "0");
const mobileQuery = matchMedia("(max-width: 850px)");
const wideOutline = matchMedia("(min-width: 1280px)");

let enabled = Object.fromEntries(Object.keys(types).map(type => [type, true]));
const rememberedFilters = readPreference("filters", {});
for (const type of Object.keys(types)) {
  if (typeof rememberedFilters[type] === "boolean") enabled[type] = rememberedFilters[type];
}
const savedLevels = readPreference("lastByLevel", {});
const lastByLevel = savedLevels && typeof savedLevels === "object" && !Array.isArray(savedLevels) ? savedLevels : {};
let current = null;
let currentNodes = [];
let lessonStates = new Map();
let outlineEntries = [];
let drawerReturnFocus = null;
function readStageId() {
  const hashId = new URLSearchParams(location.hash.slice(1)).get("stage");
  if (byId.has(hashId)) return hashId;
  const remembered = readPreference("lastStage", null);
  if (byId.has(remembered)) return remembered;
  return course.pilot_stages?.[0] || course.stages[0].uid;
}

/* ───────────── Speak Japanese knowledge parser ───────────── */
const norm = text => text.replace(/\s+/g, " ").trim();
const hasJapanese = text => /[぀-ヿ㐀-鿿]/.test(text);
const INLINE = /(?<!\S)([A-Z]{1,2}) \((JP|VI)\):\s*/g;
const BARE = /(?<!\S)(JP|VI):\s*/g;
const LINE = /^(?:(\d+)\s+)?(?:(.{1,30}?)\s*\((JP|VI)\)|(JP|VI))\s*[:：]\s*(.*)$/s;
function* leaves(parent, number) {
  for (const element of parent.children) {
    const tag = element.tagName;
    if (/^H[1-6]$/.test(tag)) yield { kind: "h", element, tag };
    else if (tag === "UL" || tag === "OL") {
      let counter = tag === "OL" ? (parseInt(element.getAttribute("start"), 10) || 1) : null;
      for (const item of element.children) {
        if (item.querySelector(":scope > p, :scope > ul, :scope > ol")) yield* leaves(item, counter);
        else yield { kind: "li", element: item, number: counter };
        if (counter !== null) counter++;
      }
    } else yield { kind: "p", element, number };
  }
}
function splitPair(text) {

  const ja = text.slice(0, at).trim(), vi = text.slice(at + 3).trim();
  const jaChars = (vi.match(/[぀-ヿ㐀-鿿]/g) || []).length;
  return hasJapanese(ja) && /[A-Za-zÀ-ỹ]{2}/.test(vi) && jaChars < vi.length * .3 ? { ja, vi } : null;
}
function parseReading(html) {
  const doc = new DOMParser().parseFromString("<!doctype html><body>" + html, "text/html");
  const blocks = [];
  let example = null, caption = null;
  const flushExample = () => { if (example && example.turns.length) blocks.push({ type: "example", ...example }); example = null; };
  const flushCaption = () => { if (caption) { blocks.push({ type: "sub", text: caption.text }); caption = null; } };
  const begin = (number, text) => {
    flushExample();
    example = { number: number ?? caption?.number ?? null, caption: text ?? caption?.text ?? null, turns: [] };
    caption = null;
  };
  const lastOpen = () => example && [...example.turns].reverse().find(turn => turn.vi === undefined);
  for (const leaf of leaves(doc.body)) {
    const text = norm(leaf.element.textContent);
    if (!text) continue;
    if (leaf.kind === "h") {
      flushExample(); flushCaption();
      blocks.push({ type: leaf.tag === "H3" ? "phrase" : "section", text });
      continue;
    }
    const marks = [...text.matchAll(INLINE)];
    if (marks.length && (marks.length > 1 || marks[0].index > 0)) {
      let prefix = text.slice(0, marks[0].index).trim().replace(/^(\d+)\s+/, "");
      const numberInText = text.slice(0, marks[0].index).trim().match(/^(\d+)\s+/);
      if (prefix) flushCaption();
      begin(leaf.number ?? (numberInText ? Number(numberInText[1]) : null), prefix || null);
      marks.forEach((mark, i) => {
        const end = i + 1 < marks.length ? marks[i + 1].index : text.length;
        const value = text.slice(mark.index + mark[0].length, end).trim().replace(/\s*—\s*$/, "").trim();
        if (mark[2] === "JP") example.turns.push({ label: mark[1], ja: value });
        else {
          const target = lastOpen();
          if (target) target.vi = value;
        }
      });
      continue;
    }
    const bare = [...text.matchAll(BARE)];
    if (bare.length > 1 && bare[0][1] === "JP") {
      flushCaption();
      begin(leaf.number);
      bare.forEach((mark, i) => {
        const end = i + 1 < bare.length ? bare[i + 1].index : text.length;
        const value = text.slice(mark.index + mark[0].length, end).trim();
        if (mark[1] === "JP") example.turns.push({ label: "", ja: value });
        else { const target = lastOpen(); if (target) target.vi = value; }
      });
      continue;
    }
    const line = text.match(LINE);
    if (line) {
      const [, number, label = "", lang1, lang2, rest] = line;
      const lang = lang1 || lang2;
      const speakerLabel = (label || "").trim();
      if (lang === "JP") {
        const changed = number && example && String(example.number) !== number;
        const lone = !speakerLabel;
        const openTurn = example && example.turns.some(turn => turn.vi === undefined);
        if (!example || caption || changed || (lone && !openTurn)) begin(number ? Number(number) : leaf.number);
        example.turns.push({ label: speakerLabel, ja: rest });
        continue;
      }
      const target = lastOpen();
      if (target) { target.vi = rest; if (speakerLabel && speakerLabel !== target.label) target.viLabel = speakerLabel; continue; }
      const previous = blocks.at(-1);
      if (!example && previous?.plainJa) {
        blocks.pop();
        blocks.push({ type: "example", number: previous.number, caption: null, turns: [{ label: "", ja: previous.plainJa, vi: rest }] });
        continue;
      }
    }
    const ab = text.match(/^([A-Za-z]{1,2})\s*[:：]\s*(.+)$/);
    if (ab && hasJapanese(ab[2])) {
      const closed = example && example.turns.length >= 2 && example.turns.every(turn => turn.vi !== undefined) && ab[1] === example.turns[0].label && example.turns.at(-1).label !== ab[1];
      if (!example || caption || closed) begin(leaf.number);
      example.turns.push({ label: ab[1], ja: ab[2] });
      continue;
    }
    if (leaf.kind === "p" && leaf.element.children.length === 1 && leaf.element.firstElementChild.tagName === "STRONG"
        && norm(leaf.element.firstElementChild.textContent) === text) {
      flushExample(); flushCaption();
      const numbered = text.match(/^(\d+)\s+(.*)$/);
      caption = { number: numbered ? Number(numbered[1]) : null, text: numbered ? numbered[2] : text };
      continue;
    }
    const pair = splitPair(text);
    if (pair) {
      flushExample(); flushCaption();
      blocks.push({ type: "example", number: leaf.number, caption: null, turns: [{ label: "", ja: pair.ja, vi: pair.vi }] });
      continue;
    }
    flushExample(); flushCaption();
    blocks.push({ type: "note", html: leaf.element.innerHTML, item: leaf.kind === "li", number: leaf.number,
      plainJa: hasJapanese(text) && !/[A-Za-zÀ-ỹ]{3}/.test(text) ? text : null });
  }
  flushExample(); flushCaption();

}
function splitGloss(text) {
  const at = text.indexOf(" — ");
  return at < 0 ? [text, ""] : [text.slice(0, at), text.slice(at + 3)];
}
function captionNode(className, text) {
  const [ja, vi] = splitGloss(text);
  const node = make("p", className);
  const first = make("span", hasJapanese(ja) ? "ja" : "", ja);
  if (hasJapanese(ja)) first.lang = "ja";
  node.append(first);
  if (vi) node.append(make("span", "vi-part", " — " + vi));

}
function renderParsedExample(block) {
  const labels = [...new Set(block.turns.map(turn => turn.label))];
  const single = block.turns.length === 1 && !block.turns[0].label;
  const speakers = labels.map(label => {
    const turn = block.turns.find(t => t.label === label);
    const role = turn.viLabel && turn.viLabel !== label ? (label ? label + " · " + turn.viLabel : turn.viLabel) : label;
    return { id: label, role_vi: role, gender: null };
  });
  if (single) {
    const card = renderSentence(null, block.turns[0], block.number != null ? "#" + pad(block.number) : null);
    if (block.caption) {
      const wrapper = make("div", "example");
      if (block.number != null) wrapper.append(make("span", "idx-chip", "#" + pad(block.number)));
      wrapper.append(captionNode("example-caption", block.caption));
      card.querySelector(".idx-chip")?.remove();
      wrapper.append(card);
      return wrapper;
    }
    return card;
  }
  const wrapper = make("div", "example");
  if (block.number != null) wrapper.append(make("span", "idx-chip", "#" + pad(block.number)));
  if (block.caption) wrapper.append(captionNode("example-caption", block.caption));
  const turns = block.turns.map(turn => ({ speaker_id: turn.label, ja: turn.ja, vi: turn.vi }));
  wrapper.append(speakers.length > 1 ? renderCast(speakers) : document.createDocumentFragment(), renderChat(speakers, turns));
  return wrapper;
}
function renderReading(html, title = "") {
  const container = make("div", "reading");
  let blocks;
  try { blocks = parseReading(html); } catch { blocks = []; }
  if (!blocks.some(block => block.type === "example")) {
    const fallback = make("div", "fallback-html");
    fallback.innerHTML = html;
    container.append(fallback);
    return container;
  }
  let grid = null;
  for (const block of blocks) {
    const sentence = block.type === "example" && block.turns.length === 1 && !block.turns[0].label && !block.caption;
    if (sentence) {
      if (!grid) { grid = make("div", "sentence-grid"); container.append(grid); }
      grid.append(renderParsedExample(block));
      continue;
    }
    grid = null;
    switch (block.type) {
      case "phrase": {
        const [ja, gloss] = splitGloss(block.text);
        if (!gloss && norm(ja) === norm(title)) break;
        const card = make("div", "phrase");
        const phraseText = make("p", "ja", ja);
        phraseText.lang = "ja";
        card.append(phraseText);
        if (gloss) card.append(make("p", "gloss", gloss));
        container.append(card);
        break;
      }
      case "section": container.append(make("h5", "sec-label", block.text)); break;
      case "sub": container.append(captionNode("sub-label", block.text)); break;
      case "note": {
        const note = make("div", "note" + (block.item ? " li" : ""));
        note.innerHTML = block.html;
        container.append(note);
        break;
      }
      case "example": container.append(renderParsedExample(block)); break;
    }
  }
  return container;
}

function nodesFor(stage) {

  for (const item of stage.order) {
    const selection = item.selection_id ? stage.selections.find(s => s.id === item.selection_id) :
      item.pack_id ? selections.get(item.book_id + "/" + item.pack_id) : null;
    let kind, title;
    switch (item.type) {
      case "vocabulary_topics": kind = "vocabulary"; title = "Từ vựng theo chủ đề"; break;
      case "speak_japanese_video": kind = "speak_video"; title = selection.title; break;
      case "speak_japanese_examples": kind = selection.support ? "reading" : "speak_shadow"; title = selection.title; break;
      case "independent_shadowing": kind = selection.support ? "reading" : "shadowing"; title = selection.title; break;
      case "source_pack": kind = "reading"; title = selection.title; break;
      case "merged_shadowing": kind = "shadowing"; title = "Shadowing tổng hợp"; break;
      case "stage_lecture": kind = "lecture"; title = stage.lecture?.title_vi || "Kiến thức tổng hợp của chặng"; break;
      case "v5_situations": kind = "situations"; title = "Các tình huống thực hành"; break;
      case "live_challenges": kind = "challenge"; title = "Vận dụng cùng Live AI"; break;
      case "free_kaiwa": kind = "free"; title = "Trò chuyện tự do"; break;
      default: continue;
    }
    result.push({ kind, title, selection, id: "lesson-" + result.length });
  }
  return result;
}

function renderLecture(lecture) {

$("empty-reset").addEventListener("click", resetFilters);
$("toggle-vi").addEventListener("click", () => setTranslation(document.documentElement.dataset.vi === "off"));
$("ja-smaller").addEventListener("click", () => setJaScale(Number(getComputedStyle(document.documentElement).getPropertyValue("--ja-scale")) - .1));
$("ja-bigger").addEventListener("click", () => setJaScale(Number(getComputedStyle(document.documentElement).getPropertyValue("--ja-scale")) + .1));
$("expand-all").addEventListener("click", () => {
  for (const node of currentNodes) if (enabled[node.kind]) { const state = ensureLesson(node.id); if (state) state.detail.open = true; }
  for (const group of document.querySelectorAll(".ol-group.collapsed")) group.classList.remove("collapsed");
  for (const element of document.querySelectorAll("details.event, details.scene")) element.open = true;
  updateSpy();
});
$("collapse-all").addEventListener("click", () => {
  for (const state of lessonStates.values()) state.detail.open = false;
  for (const group of document.querySelectorAll("#outline-tree .ol-group")) if (group.querySelector(".ol-children")) group.classList.add("collapsed");
  updateSpy();
});
document.addEventListener("click", event => {
  if (!event.target.closest(".filter-anchor")) closeFilters();
  const bubble = event.target.closest(".bubble, .sentence");
  if (bubble && document.documentElement.dataset.vi === "off" && !event.target.closest("a, button")) bubble.classList.toggle("reveal");
});
$("open-nav").addEventListener("click", () => setDrawer(true));
$("close-nav").addEventListener("click", () => setDrawer(false));
$("fab-outline").addEventListener("click", () => setOutline(true));
$("close-outline").addEventListener("click", () => setOutline(false));
$("overlay").addEventListener("click", () => { setDrawer(false); setOutline(false); });
document.addEventListener("keydown", event => {
  if (event.key === "Escape") { closeFilters(); setDrawer(false); setOutline(false); }
  if (event.key === "Tab") {
    const container = document.body.classList.contains("drawer-open") ? $("sidebar")
      : document.body.classList.contains("outline-open") ? $("outline") : null;
    if (!container) return;
    const focusable = [...container.querySelectorAll("button,input,summary")].filter(el => el.getClientRects().length);
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});
function syncViewport() {
  setDrawer(false);
  setOutline(false);
  $("sidebar").inert = mobileQuery.matches;
  $("outline").inert = !wideOutline.matches;
  if (!mobileQuery.matches) $("sidebar").inert = false;
  if (!mobileQuery.matches) document.body.classList.remove("chrome-hidden");
  updateSpy();
}
mobileQuery.addEventListener("change", syncViewport);
wideOutline.addEventListener("change", syncViewport);
addEventListener("scroll", () => {
  if (!spyFrame) spyFrame = requestAnimationFrame(updateSpy);
  if (programmatic) {
    clearTimeout(programmaticTimer);
    programmaticTimer = setTimeout(() => { programmatic = false; lastScroll = scrollY; }, 250);
    lastScroll = scrollY;
    return;
  }
  if (!mobileQuery.matches) { lastScroll = scrollY; return; }
  const delta = scrollY - lastScroll;
  if (Math.abs(delta) < 8) return;
  document.body.classList.toggle("chrome-hidden", delta > 0 && scrollY > 140);
  lastScroll = scrollY;
}, { passive: true });
addEventListener("resize", () => { if (!spyFrame) spyFrame = requestAnimationFrame(updateSpy); });
$("previous").addEventListener("click", () => {
  const list = stageLists[current.level], index = list.findIndex(s => s.uid === current.uid);
  if (index > 0) navigate(list[index - 1].uid);
});
$("next").addEventListener("click", () => {
  const list = stageLists[current.level], index = list.findIndex(s => s.uid === current.uid);
  if (index < list.length - 1) navigate(list[index + 1].uid);
});
addEventListener("hashchange", () => {
  const id = readStageId();
  if (id !== current.uid) showStage(id);
});

/* ───────────── Start ───────────── */
if (course.pilot_stages?.length) {
  $("pilot-links").hidden = false;
  const vocabularyPilot = /^12\.\d+-pilot$/.test(course.version);
  const lecturePilot = course.version === "14.0-pilot";
  $("pilot-links").open = vocabularyPilot || lecturePilot;
  $("pilot-summary").textContent = (vocabularyPilot ? "Pilot từ vựng" : lecturePilot ? "Pilot bài giảng" : "Chặng pilot") + " (" + course.pilot_stages.length + ")";
  for (const uid of course.pilot_stages) {
    const stage = byId.get(uid);
    if (!stage) continue;
    const link = make("a", "", "Pilot " + stage.level + " · " + stage.title);
    link.href = "#stage=" + uid;
    $("pilot-list").append(link);
  }
}
$("foot-count").textContent = course.stages.length + " chặng · luyện nghe & nói";
$("version").textContent = "V" + course.version;
$("nav-version").textContent = "V" + course.version;
setTranslation(document.documentElement.dataset.vi !== "off");
setJaScale(Number(getComputedStyle(document.documentElement).getPropertyValue("--ja-scale")) || 1);
themeButton();
syncViewport();
showStage(readStageId());
</script>
</body>
</html>
