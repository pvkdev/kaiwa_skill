<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaiwa V5 — Lộ trình và tình huống</title>
<style>
:root{color-scheme:light dark;--bg:#fbfbf8;--fg:#202921;--muted:#59685d;--line:#d2dbd1;--panel:#f0f4ef;--accent:#19623b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 system-ui,sans-serif}header{padding:24px 30px 16px;border-bottom:1px solid var(--line)}header>div,header>p{max-width:1500px;margin-inline:auto}h1{font-size:28px;margin:0 0 4px;line-height:1.3}h2{font-size:23px;line-height:1.35}h3{font-size:17px}p{margin:10px 0}a{color:var(--accent)}button,input,select{font:inherit;border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:4px;padding:7px 10px}button{cursor:pointer}button:hover,button[aria-current=true]{background:var(--panel);border-color:var(--accent)}.muted{color:var(--muted)}.small{font-size:13px}.metrics{display:flex;gap:30px;flex-wrap:wrap;margin:18px 0 12px}.metric strong{font-size:25px;color:var(--accent);margin-right:7px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.controls input{min-width:260px;flex:1}.layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);max-width:1560px;margin:auto;min-height:75vh}.sidebar{padding:16px 18px;border-right:1px solid var(--line);max-height:85vh;overflow:auto;position:sticky;top:0}.stage-button{display:block;text-align:left;width:100%;margin:0 0 7px;border-color:transparent;padding:9px 12px}.stage-button strong{display:block;font-weight:600}.stage-button span{display:block;font-size:12px;color:var(--muted)}.cluster-label{font-size:12px;text-transform:uppercase;color:var(--muted);margin:22px 10px 7px;letter-spacing:.04em}article{padding:20px 38px 60px;max-width:1100px}.eyebrow{font-size:13px;color:var(--accent);font-weight:650}.facts{padding-block:12px;border-block:1px solid var(--line);margin-block:18px}.facts p{margin:6px 0}details{border-bottom:1px solid var(--line);padding:13px 0}summary{font-size:17px;font-weight:600;cursor:pointer}.event-meta{font-size:13px;color:var(--muted);font-weight:400}.scene{padding:10px 0;border-bottom:1px dotted var(--line);line-height:1.6}.scene:last-child{border-bottom:0}.scene-id{color:var(--muted);font-size:12px;display:block}.branch{font-size:12px;color:var(--accent);margin-right:5px}.after{display:block;font-size:12px;color:var(--muted)}.source-note{background:var(--panel);padding:14px 18px;margin-top:22px}.nav{display:flex;gap:10px;margin-top:25px;justify-content:space-between}.links{display:flex;gap:14px;flex-wrap:wrap}.empty{padding:20px;color:var(--muted)}mark{background:var(--panel);color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(prefers-color-scheme:dark){:root{--bg:#172019;--fg:#e1e9e2;--muted:#afbeb0;--line:#3e5141;--panel:#253429;--accent:#9bd9ac}}@media(max-width:850px){header{padding:18px}.layout{display:block}.sidebar{position:static;max-height:310px;border-right:0;border-bottom:1px solid var(--line)}article{padding:20px}.controls input{min-width:100%}}@media print{.sidebar,.controls,.links,.nav{display:none}.layout{display:block}article{max-width:none;padding:0 25px}.scene{break-inside:avoid}header{padding:15px}body{font-size:11px}}
</style></head><body>
<header><div><p class="eyebrow">KAIWA / V5 / 13.11.2026</p><h1>Bạn chỉ giỏi kaiwa khi bạn nói đủ nhiều</h1><p class="muted">Một lộ trình chung từ tài nguyên sách, nghiên cứu ngoài và AI biên soạn. Đây là khung chặng và tình huống, chưa phải bộ hội thoại/bài học hoàn chỉnh.</p><div class="metrics" id="metrics"></div><div class="links"><a href="KAIWA_CHANG_V5.md">Mục lục Markdown</a><a href="DESIGN_AND_MIGRATION.md">Thiết kế & chuyển tiếp</a><a href="EDITORIAL_REVIEW.md">Nghiệm thu & giới hạn</a></div><div class="controls"><input id="q" aria-label="Tìm topic hoặc tình huống" placeholder="Tìm topic, tình huống, key cũ/mới, từ khóa…"><select id="level" aria-label="Cấp độ"><option value="">Ba cấp độ</option>Sơ</option><option>Trung</option><option>Thượng</option></select><select id="track" aria-label="Nhánh"><option value="">Đời sống & công việc</option><option>Đời sống</option><option>Công việc</option></select><select id="cluster" aria-label="Cụm"><option value="">Mọi cụm</option></select></div><p id="count" class="small muted" aria-live="polite"></p></div></header>
<div class="layout"><aside class="sidebar" id="stage-list" aria-label="Danh sách chặng"></aside><article id="detail" aria-live="polite"></article></div>
<script id="data" type="application/json">__DATA__</script><script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase();
const byUID=Object.fromEntries(D.stages.map(s=>[s.uid,s])),byKey=Object.fromEntries(D.stages.map(s=>[s.key,s]));
let selected=D.stages[0].uid,filtered=D.stages;
$('metrics').innerHTML=[['Chặng',D.stats.stages],['Họ sự kiện',D.stats.events],['Tình huống',D.stats.situations],['Cụm',D.stats.clusters]].map(([l,n])=>'<div class="metric"><strong>'+Number(n).toLocaleString('vi-VN')+'</strong>'+l+'</div>').join('');
const groups=new Map(D.stages.map(s=>[s.cluster_id,s]));$('cluster').innerHTML+=[...groups.values()].map(s=>'<option value="'+esc(s.cluster_id)+'">'+esc(s.level+' / '+s.cluster_title)+'</option>').join('');
function sourceText(s){const b=s.source_basis;return '<p><strong>Tình huống: AI biên soạn.</strong> Nguồn ngoài và sách cung cấp bối cảnh, kiến thức hoặc cách nói; không mặc định mọi cảnh đã có mẫu nguồn tương ứng.</p><p>Tra sách: '+esc(b.lookup_books_not_verified.join(', ')||'theo chức năng phù hợp')+'</p><p>Nghiên cứu ngoài: '+esc(b.external_research.join(', ')||'chưa gắn riêng')+'</p>'+(b.book_evidence_from_preview.length?'<p>Đoạn đọc từ preview: '+esc(b.book_evidence_from_preview.join(', '))+'</p>':'')}
function detail(s){const events=s.events.map(e=>{const cases=s.situations.filter(c=>c.event_id===e.id);return '<details open><summary>'+esc(e.id+' — '+e.name)+'<div class="event-meta">'+esc(e.roles.join(' ↔ '))+' · '+cases.length+' cảnh</div></summary>'+cases.map(c=>'<div class="scene" id="'+esc(c.id)+'"><span class="scene-id">'+esc(c.id)+'</span><span class="branch">'+esc(D.branch_labels[c.branch])+'</span>'+esc(c.title)+(c.continues_from?.length?'<span class="after">Tiếp từ '+c.continues_from.map(id=>'<a href="#'+esc(id)+'">'+esc(id)+'</a>').join(', ')+'</span>':'')+'</div>').join('')+'</details>'}).join('');
const related=s.cross_stage_refs.map(k=>{const t=byKey[k];return t?'<button class="related" data-uid="'+esc(t.uid)+'">'+esc(t.display_code+' · '+t.title)+'</button>':esc(k+' (xem chuyển tiếp)')}).join(' ');
$('detail').innerHTML='<p class="eyebrow">'+esc(s.level+' / '+s.cluster_title)+'</p><h2>'+esc(s.display_code+' — '+s.title)+'</h2><p class="muted">'+esc(s.track+' · '+s.events.length+' họ sự kiện · '+s.situations.length+' tình huống')+'</p><p>'+esc(s.objective)+'</p><div class="facts"><p><strong>Kiến thức sẽ lồng ghép:</strong></p><ul>'+s.knowledge_focus.map(k=>'<li>'+esc(k)+'</li>').join('')+'</ul><p><strong>Ranh giới:</strong> '+esc(s.coverage_note)+'</p>'+(s.scope_note?'<p><strong>Phân ranh từ V4.1:</strong> '+esc(s.scope_note)+'</p>':'')+'</div>'+events+(related?'<h3>Chặng liên quan</h3><div class="links">'+related+'</div>':'')+'<div class="source-note">'+sourceText(s)+'</div><p class="small muted">Key '+esc(s.key)+' · UID '+esc(s.uid)+'. Thứ tự là gợi ý, mọi chặng mở tự do. Chưa có hội thoại Nhật–Việt đầy đủ trong bản roadmap.</p><div class="nav"><button id="prev">Chặng trước</button><button id="next">Chặng tiếp</button></div>';
$('detail').querySelectorAll('[data-uid]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.uid)));
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);}
function step(n){const i=D.stages.findIndex(s=>s.uid===selected),s=D.stages[i+n];if(s){$('q').value='';$('level').value='';$('track').value='';$('cluster').value='';select(s.uid)}}
function select(uid){selected=uid;render();}
function render(){const raw=$('q').value.trim(),q=norm(raw),level=$('level').value,track=$('track').value,cluster=$('cluster').value,legacy=D.migration[raw.toUpperCase()];const targets=legacy?.redirect_uids||[];
filtered=D.stages.filter(s=>(!level||s.level===level)&&(!track||s.track===track)&&(!cluster||s.cluster_id===cluster)&&(!q||norm(JSON.stringify(s)).includes(q)||targets.includes(s.uid)));
if(filtered.length&&!filtered.some(s=>s.uid===selected))selected=filtered[0].uid;
$('count').textContent=filtered.length+' / '+D.stages.length+' chặng · '+filtered.reduce((n,s)=>n+s.situations.length,0).toLocaleString('vi-VN')+' tình huống trong bộ lọc. Có thể tìm bằng key V4.1; chặng đã gộp sẽ trỏ sang nơi tiếp nhận.';
let group='';$('stage-list').innerHTML=filtered.map(s=>{let label='';if(group!==s.cluster_id){group=s.cluster_id;label='<p class="cluster-label">'+esc(s.level+' / '+s.cluster_title)+'</p>'}return label+'<button class="stage-button" data-uid="'+esc(s.uid)+'" aria-current="'+String(selected===s.uid)+'"><strong>'+esc(s.display_code+' · '+s.title)+'</strong><span>'+esc(s.track+' / '+s.situations.length+' cảnh / '+s.key)+'</span></button>'}).join('')||'<p class="empty">Không có chặng khớp; thử bỏ bớt bộ lọc.</p>';
$('stage-list').querySelectorAll('[data-uid]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.uid)));
if(filtered.length)detail(byUID[selected]);else $('detail').innerHTML='<p class="empty">Thay từ khóa hoặc bộ lọc để xem chặng.</p>';}
['q','level','track','cluster'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));render();
</script></body></html>
